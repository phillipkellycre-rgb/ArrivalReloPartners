function ccCurate(relId){
  const r = anyRel(relId); if(!r) return;
  const city = (r.dest||'').split(',')[0].trim();
  const local = S.agents.filter(a=>(a.market||'').indexOf(city)===0);
  const fill = S.agents.filter(a=>(a.market||'').indexOf(city)!==0).sort((x,y)=>y._rating-x._rating);
  const picks = local.concat(fill).slice(0,3);
  S.candidates[relId] = picks.map((a,i)=>({agentId:a.id, score:95-i*7,
    why:[a.specs[0], (a.market||'').indexOf(city)===0?'Local market expert':'Nearby-market exception (coverage gap)', a.resp+' median response'],
    recent:`${a.done} managed relocations completed. ${(a.market||'').indexOf(city)===0?'':'Flagged: outside primary market, exception approval noted.'}`}));
  if(r.status==='Intake'||r.status==='Preferences Pending'){ r.status='Matching'; r.progress=Math.max(r.progress,22); }
  save(); toast('Three agents curated', city + (local.length<3 ? ' roster is thin, out-of-market exceptions included.' : ' candidates ready to send.'), local.length<3?'err':'ok'); route();
}
function ccAssign(relId, agentId){
  const r = anyRel(relId), a = agentById(agentId); if(!r||!a) return;
  confirmModal('Assign agent?', `<b>${esc(a.name)}</b> will be assigned to <b>${esc(r.emp)}</b> and the managed introduction begins.`, 'Assign agent', ()=>{
    r.agentId = agentId; r.status='Agent Assigned'; r.progress=Math.max(r.progress,42); delete S.candidates[relId];
    save(); toast('Agent assigned', a.name+' → '+r.emp, 'ok'); route();
  });
}

  const t=(S.tasks||[]).find(x=>x.id===id); if(!t) return;
  const r = await Data.toggleTask(id, !t.done);

}

/* ---------- coverage ---------- */
function ccCoverage(){
  const roster = {};
  S.agents.filter(a=>a.market).forEach(a=>{ const c=a.market.split(',')[0].trim(); roster[c]=(roster[c]||0)+1; });
  const demand = {};
  allRels().filter(r=>r.status!=='Completed').forEach(r=>{ const c=(r.dest||'').split(',')[0].trim(); demand[c]=(demand[c]||0)+1; });
  /* Cities where Arrival actually has agents or active demand, not a fixed
     market list that reports gaps in cities nobody is moving to. */
  const cities = [...new Set([...Object.keys(roster), ...Object.keys(demand)])]
    .map(c=>({city:c, roster:roster[c]||0, demand:demand[c]||0}))
    .sort((a,b)=>(b.demand-b.roster)-(a.demand-a.roster));
  const gaps = cities.filter(c=>c.demand > c.roster);
  return `
  ${gaps.length?`<div class="card card-pad" style="border-color:var(--gold);background:linear-gradient(160deg,#fff,#FCF7EC)">
    <div class="flex gap12"><div class="icbox gold">${ic('alert')}</div>
    <div><h3 style="font-size:15px">Coverage gap alert${gaps.length>1?'s':''}</h3>
    ${gaps.map(g=>`<p class="small" style="margin-top:4px;color:var(--ink)"><b>${esc(g.city)}</b>, ${g.demand} active demand item${g.demand===1?'':'s'} vs ${g.roster} roster agent${g.roster===1?'':'s'}.</p>`).join('')}
    <a class="btn btn-gold btn-sm" style="margin-top:10px" href="/command-center/agents" data-nav>Review the roster</a></div></div></div>`:''}
  <div class="card card-pad" style="margin-top:14px"><h3 style="font-size:15px;margin-bottom:10px">National coverage</h3>${mapSVG('cc')}</div>
  <div class="card" style="margin-top:14px"><div class="card-pad" style="padding-bottom:0"><h3 style="font-size:15px">Market depth, roster vs demand</h3></div>
    <div class="scroll-x"><table class="tbl">
    <thead><tr><th>Market</th><th>Roster agents</th><th>Active demand</th><th>Status</th></tr></thead>
    <tbody>${cities.sort((a,b)=>b.demand-a.demand).map(c=>`<tr>
      <td><b style="color:var(--navy)">${esc(c.city)}</b></td><td class="num">${c.roster}</td><td class="num">${c.demand}</td>
      <td>${c.demand>c.roster?'<span class="badge b-red">Gap</span>':c.demand===c.roster&&c.demand>0?'<span class="badge b-amber">Tight</span>':'<span class="badge b-teal">Covered</span>'}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

async function txInvoice(id){
  const t = (S.transactions||[]).find(x=>x.id===id); if(!t) return;
  const btn = event && event.currentTarget;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending…'; }

  const r = await Data.sendInvoice(id);

  if(!r.ok){
    if(btn){ btn.disabled = false; btn.textContent = 'Send invoice'; }
    toast('Not sent', r.message || 'The invoice was not issued.', 'err');
    return;
  }
  /* Data.refresh() has already re-rendered from the database, so the row on
     screen is what Postgres holds, not what the browser hoped for. */
  toast('Invoice issued', r.invoice + ', ' + fmtMoney(t.fee) + ' to ' + t.company +
        (r.due ? ', due ' + fmtDs(r.due) : ''), 'ok');
}

async function txPaid(id){
  const t = (S.transactions||[]).find(x=>x.id===id); if(!t) return;
  const btn = event && event.currentTarget;
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Recording…'; }

  const r = await Data.markTransactionPaid(id);

  if(!r.ok){
    if(btn){ btn.disabled = false; btn.textContent = 'Mark paid'; }
    toast(r.already ? 'Already recorded' : 'Not recorded',
          r.message || 'The payment was not recorded.', r.already ? 'ok' : 'err');
    return;
  }
  toast('Payment recorded', fmtMoney(r.fee) + ' from ' + t.company +
        ' (' + (r.invoice || 'no invoice') + ')', 'ok');
}

async function ccInvite(){
  const em = (document.getElementById('inv-email').value||'').trim().toLowerCase();
  const role = document.getElementById('inv-role').value;
  const btn = document.getElementById('inv-btn');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('Check the address','That does not look like an email address.','err'); return; }
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Inviting\u2026'; }
  const r = await Data.invite(em, role, null, null);
  if(!r.ok){
    if(btn){ btn.disabled=false; btn.innerHTML = ic('mail','ic-sm')+' Send invitation'; }
    toast('Not invited', r.error && r.error.code==='42501'
      ? 'You do not have permission to add that role.' : 'That invitation was not saved.', 'err');
    return;
  }
  /* The row grants access; this tells them it exists. If the note fails the
     access is still real, so say precisely that rather than implying the whole
     thing failed. */
  const note = await Data.notifyInvite(em, role);
  document.getElementById('inv-email').value = '';
  if(btn){ btn.disabled=false; btn.innerHTML = ic('mail','ic-sm')+' Send invitation'; }
  if(note.ok) toast('Invitation sent', em + ' has been emailed a link to sign in.', 'ok');
  else toast('Access granted, email not sent', note.message || ('Ask ' + em + ' to sign in at arrivalrelopartners.com/login.'), 'err');
  route();
}

CRED_BADGE['Under Review'] = 'b-navy';
/* The signed-in agent's own record. This returned the seeded agent 'ag-01', so
   every real agent saw that person's name, brokerage and licence. Returns a
   safe shell rather than undefined when the roster has not loaded, because a
   missing record must not take the whole portal down. */
/* Licence details live on the agent record. There is no separate credentials
   table, so this derives the one row we actually hold rather than inventing a
   compliance list. */
function agCredentials(){
  const a = ME && ME.agentId ? agentById(ME.agentId) : null;
  if(!a || !a.license) return [];
  const exp = a.licenseExpires ? new Date(a.licenseExpires) : null;
  const days = exp ? Math.floor((exp - Date.now())/86400000) : null;
  return [{ name:'Real Estate License' + (a.licenseState?' ('+a.licenseState+')':''),
            no:a.license, exp:a.licenseExpires,
            status: days==null ? 'On file' : days < 0 ? 'Expired' : days < 60 ? 'Expiring Soon' : 'Active' }];
}
function agMe(){
  const a = ME && ME.agentId ? agentById(ME.agentId) : null;
  return a || { id:null, name:(ME&&ME.name)||'Agent', brokerage:'', market:'', email:(ME&&ME.email)||'',
                yrs:null, done:0, rating:null, langs:[], specs:[], bio:'' };
}
function oppById(id){ return (S.opportunities||[]).find(o=>o.id===id); }

  const credAlerts = agCredentials().filter(c=>['Expiring Soon','Missing','Expired'].includes(c.status)).length;
  const groups = [
    ['Work', [
      {h:'/', l:'Dashboard', i:'grid'},
      {h:'/opportunities', l:'Opportunities', i:'sparkle', cnt:newOpps||null},
      {h:'/assignments', l:'Assignments', i:'move'},
      {h:'/messages', l:'Messages', i:'mail', cnt:unread||null},

function agOpps(){
  const opps = S.opportunities||[];
  const order = ['New','Interview Scheduled','Accepted','Active','Under Contract','Completed','Declined','Expired'];

  return `<p class="muted small" style="margin-bottom:12px">Opportunities are curated for you by Arrival. Pre-acceptance summaries are privacy-gated, no employee names or contact details until you accept.</p>
  <div style="display:flex;flex-direction:column;gap:12px">${sorted.map(oppCard).join('')}</div>`;
}

function agUpdateModal(oppId){
  const o = oppById(oppId); if(!o||!o.relId) return;
  openModal(`
    <div class="modal-h"><h3 style="font-size:17px">Milestone update, ${esc(o.relId)}</h3><button class="x" onclick="closeModal()">${ic('x','ic-sm')}</button></div>

        <option>Home search started</option><option>Offer submitted</option><option>Under contract</option><option>Inspection complete</option><option>Appraisal complete</option><option>Financing approved</option><option>Closing scheduled</option><option>Closed</option></select></div>
      <div class="field"><label>Note for the Arrival coordinator</label><textarea class="in" id="au-note" placeholder="What happened, and what\u2019s next?"></textarea></div>
      <p class="tiny muted">Posting updates Arrival in real time and refreshes the employer's tracking view. The employer sees the milestone, never the private file detail.</p>
    </div>
    <div class="modal-f"><button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>

const MS_STATUS = {'Home search started':'Home Search','Under contract':'Under Contract','Closing scheduled':'Closing Scheduled','Closed':'Completed'};
function agUpdateGo(oppId){
  const o = oppById(oppId); const r = anyRel(o.relId); if(!r) return;
  const ms = document.getElementById('au-ms').value;
  const note = document.getElementById('au-note').value.trim();
  const today = new Date().toISOString().slice(0,10);
  const ts = today + ' ' + new Date().toTimeString().slice(0,5);
  r.notes = ms + (note ? ', ' + note : '') + ' (agent update)';
  r.progress = Math.min(100, r.progress + 5); r.last = today;
  if(MS_STATUS[ms]){ r.status = MS_STATUS[ms]; if(ms==='Closed') r.progress = 100; }
  const th = (S.threads||[]).find(t=>t.rel===o.relId);
  if(th) th.msgs.push({who:agMe().name, role:'Agent', ts, text:'Milestone: '+ms+(note?', '+note:'')});
  // real-time visibility to Arrival: activity log + notification
  S.activity = S.activity||[]; S.activity.unshift({id:'a-x'+Date.now(),ts,rel:o.relId,who:agMe().name,kind:'status',text:`Milestone update, ${ms} for ${r.emp} (${o.relId}).`});
  S.notifications = S.notifications||[]; S.notifications.unshift({id:'n-x'+Date.now(),ts,kind:'status',text:`${ms}, ${r.emp} (${o.relId})`,rel:o.relId,read:false});
  save(); closeModal(); toast('Update posted', ms+', Arrival is notified and the employer\u2019s tracking view is updated.', 'ok'); route();
}

/* ---------- Direct Relocation: intake wizard ---------- */
const DRW_KEY = 'arrival_dr_intake_v1';
let DRW = (function(){ try{ return JSON.parse(localStorage.getItem(DRW_KEY)) || {step:1,d:{}}; }catch(e){ return {step:1,d:{}}; } })();
function drwSave(){ try{ localStorage.setItem(DRW_KEY, JSON.stringify(DRW)); }catch(e){} }
function drwSet(k){ const el=document.getElementById('drw-'+k); if(el) DRW.d[k] = el.type==='checkbox' ? el.checked : el.value; drwSave(); }
function drwCollect(ids){ ids.forEach(drwSet); }
const DRW_STEPS = ['About You','Move Overview','Real Estate Needs','Household & Lifestyle','Agent Preferences','How You Heard About Us','Review & Consent'];
function drwField(label, k, ph, type){ const v=esc(DRW.d[k]||''); return `<div class="field"><label>${label}</label><input class="in" id="drw-${k}" type="${type||'text'}" value="${v}" placeholder="${ph||''}" oninput="drwSet('${k}')"></div>`; }
function drwSelect(label, k, opts){ const v=DRW.d[k]||''; return `<div class="field"><label>${label}</label><select class="in" id="drw-${k}" onchange="drwSet('${k}');route()">${['',...opts].map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${o||'Select…'}</option>`).join('')}</select></div>`; }
function drwArea(label, k, ph){ const v=esc(DRW.d[k]||''); return `<div class="field"><label>${label}</label><textarea class="in" id="drw-${k}" rows="3" placeholder="${ph||''}" oninput="drwSet('${k}')">${v}</textarea></div>`; }
function drwStepBody(){
  const d = DRW.d;
  switch(DRW.step){
    case 1: return drwField('First name *','first','Jordan') + drwField('Last name *','last','Avery') + drwField('Email *','email','you@example.com','email') + drwField('Phone','phone','(555) 555-0100','tel') + drwSelect('Preferred contact method','contact',['Email','Phone call','Text message']);

    case 5: return drwSelect('Communication style you prefer in an agent','commstyle',['Frequent updates, text/call anytime','Weekly summary check-ins','Only when there\u2019s news']) + drwField('Language preference (optional)','language','English') + drwArea('Anything else your ideal agent should know? (optional)','agentnotes','First time buying out of state; patient explainer appreciated…');

    }
  }
  return '';

function drwValidate(){
  const d = DRW.d, miss = [];
  if(DRW.step===1){ if(!(d.first||'').trim()) miss.push('first name'); if(!(d.last||'').trim()) miss.push('last name'); if(!(d.email||'').trim() || !(d.email||'').includes('@')) miss.push('valid email'); }
  if(DRW.step===2){ if(!(d.origin||'').trim()) miss.push('origin'); if(!(d.dest||'').trim()) miss.push('destination'); if(!d.timeline) miss.push('timeline'); }
  if(DRW.step===3 && !d.mode) miss.push('your plan (buy / rent / sell & buy)');
  if(DRW.step===6 && !d.heard) miss.push('how you heard about us');
  if(DRW.step===7 && !d.consent) miss.push('the consent checkbox');
  return miss;
}
function drwNext(){
  const miss = drwValidate();
  if(miss.length){ toast('A few things first','Please provide: ' + miss.join(', ') + '.', 'warn'); return; }
  if(DRW.step===7){ drSubmitIntake(); return; }
  DRW.step++; drwSave(); route(); window.scrollTo(0,0);
}
function drwBack(){ if(DRW.step>1){ DRW.step--; drwSave(); route(); window.scrollTo(0,0); } }

    channel: referred?'Referred':'Direct', source: referred ? ('Referral, ' + (d.refname||'name not provided')) : (d.heard||'Direct inquiry'),
    refName: referred?(d.refname||''):undefined, refRelation: referred?(d.refrel||''):undefined,
    stage:'New Inquiry', created:'2026-06-12', last:'2026-06-12', agentIds:[], agentId:null, relId:null, token:null,
    prefs:[d.commstyle,d.language?('Language: '+d.language):'',d.priorities,d.agentnotes].filter(Boolean).join(' · '),
    notes:'Submitted via Direct Relocation intake form.' + (d.musts?(' Must-haves: '+d.musts):'') + (d.reason?(' Reason: '+d.reason):'')};
  S.directInquiries = S.directInquiries||[]; S.directInquiries.unshift(inq); save();
  DRW = {step:8, doneId:id, doneEmail:d.email, d:{}}; try{ localStorage.removeItem(DRW_KEY); }catch(e){}
  route(); window.scrollTo(0,0);
  toast('Inquiry received', 'Confirmation email simulated to ' + inq.email + ', request ' + id + '.', 'ok');
}

const J_STEPS = ['Inquiry received','Discovery & needs','Agents presented','Agent selected','Relocation underway','Completed'];
function jStepIndex(stage){
  const i = DR_STAGES.indexOf(stage);
  if(stage==='Completed') return 5;
  if(['Converted to Relocation','Active','Home Search','Under Contract','Closing','Settling In'].includes(stage)) return 4;
  if(stage==='Agent Selected') return 3;
  if(['Agents Presented','Interview Stage'].includes(stage)) return 2;
  if(i>=1 && i<=6) return 1;
  return 0;
}

function drStage(id){
  const inq = drById(id); if(!inq) return;
  const el = document.getElementById('dr-stage-'+id); if(!el) return;
  inq.stage = el.value; inq.last = '2026-06-12'; save(); route();
  toast('Stage updated', inq.name + ' \u2192 ' + inq.stage + '.', 'ok');
}
function drCopyJourney(id){
  const inq = drById(id); if(!inq) return;
  if(!inq.token){ inq.token = drNewToken(); save(); route(); }
  copyLink('/journey/' + inq.token);
}
function drCurate(id){
  const inq = drById(id); if(!inq) return;
  const sel = new Set(inq.agentIds||[]);
  openModal(`
    <div class="modal-h"><h3 style="font-size:17px">Curate agents, ${esc(inq.name)}</h3><button class="x" onclick="closeModal()">${ic('x','ic-sm')}</button></div>
    <div class="modal-b"><p class="tiny muted" style="margin-bottom:10px">Select up to three agents to present for ${esc(inq.dest)}.</p>
      <div style="max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px">
        ${S.agents.map(a=>`<label class="flex gap10" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;align-items:center">
          <input type="checkbox" class="dr-cur" value="${a.id}" ${sel.has(a.id)?'checked':''}>
          <div class="avatar" style="width:28px;height:28px;font-size:10px">${initials(a.name)}</div>
          <div style="min-width:0"><b style="font-size:12.5px;color:var(--navy)">${esc(a.name)}</b><div class="tiny muted">${esc(a.market)} · ${a.rating}\u2605 · ${a.done} relocations</div></div>
        </label>`).join('')}
      </div></div>
    <div class="modal-f"><button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>

}
function drCurateSave(id){
  const inq = drById(id); if(!inq) return;
  const picked = Array.from(document.querySelectorAll('.dr-cur:checked')).map(el=>el.value);
  if(picked.length>3){ toast('Three at most','Present no more than three agents at a time.','warn'); return; }
  inq.agentIds = picked;
  if(picked.length && ['New Inquiry','Contacted','Qualified','Discovery Call Scheduled','Discovery Call Completed','Needs Assessment','Agent Matching'].includes(inq.stage)) inq.stage='Agents Presented';
  if(picked.length && !inq.token) inq.token = drNewToken();
  inq.last='2026-06-12'; save(); closeModal(); route();
  toast('Agents updated', picked.length + ' agent' + (picked.length===1?'':'s') + ' curated for ' + inq.name + '.', 'ok');
}
function drConvert(id){
  const inq = drById(id); if(!inq || inq.relId) return;
  confirmModal('Convert to relocation?', 'Creates a ' + esc(inq.channel.toLowerCase()) + '-channel consumer relocation for ' + esc(inq.name) + ' (self-funded, no corporate account).', 'Convert', ()=>{
    const relId = nextRelId();
    const rel = {id:relId, company: inq.channel==='Referred'?'Referred (Consumer)':'Direct (Consumer)', channel:inq.channel, emp:inq.name, role:'Consumer relocation', dept:'—', email:inq.email, phone:inq.phone, origin:inq.origin, dest:inq.dest, type:inq.channel+' Relocation', mode: /rent/i.test(inq.mode||'')?'Renter':'Buyer', status:'Active', risk:'Low', agentId:inq.agentId||null, target:'2026-09-30', submitted:'2026-06-12', pace:7.0, progress:12, last:'2026-06-12', budget:inq.budget||'TBD', household:inq.household||'—', notes:'Converted from '+inq.channel.toLowerCase()+' inquiry '+inq.id+'.'+(inq.refName?' Referred by '+inq.refName+'.':''), inqId:inq.id, refName:inq.refName};
    S.relocations.unshift(rel);
    inq.relId = relId; inq.stage='Converted to Relocation'; inq.last='2026-06-12';
    const ref = (S.referrals||[]).find(r=>r.inqId===inq.id); if(ref) ref.status='Active', ref.relId=relId;
    save(); nav('/command-center/relocations/'+relId);
    toast('Relocation created', inq.name + ' is now ' + relId + ' (' + inq.channel + ' channel).', 'ok');
  });
}
function drLost(id){
  const inq = drById(id); if(!inq) return;

}

/* ---- Score model (versioned, deterministic. NOT AI) ---- */
const MR_SCORE_MODEL = {
  name:'ARV-RELO', version:'0.1.0-draft', approved:false, effective:'2026-07-12',
  weighting:'Equal weight across eligible categories (draft). Production weights require Arrival sign-off before real reports can be approved.',
  confidence:'confidence = round(100 × (0.7 × required-data completeness + 0.3 × provider success rate)) − 4 per manual override',
};
function mrClamp(v){ return Math.max(5, Math.min(98, Math.round(v))); }
function mrMortgage(price, ratePct, years, downPct){
  const P = price*(1-downPct/100), r = ratePct/100/12, n = years*12;
  return P*r/(1-Math.pow(1+r,-n));
}
/* Each calculator returns {score, expl, formula, dps:[dataPointKeys]} or {blocked:reason} */
const MR_CALCS = {
  housing:{label:'Housing Affordability', icon:'home', calc:(inp,o,d)=>{
    const price = inp.targetPrice || d.home;
    const monthly = inp.mode==='Renter' ? d.rent2 : mrMortgage(price, inp.rate, inp.term, inp.downPct) + price*(d.propTax/100)/12 + price*0.0035/12;
    const bench = 0.28*inp.salary/12;
    const score = mrClamp(46*(bench/monthly)+10);
    return {score, val:monthly, formula:'clamp(46 × (28% of gross monthly ÷ est. monthly housing cost) + 10)', expl:`Estimated ${inp.mode==='Renter'?'rent':'PITI'} ${fmtMoney(Math.round(monthly))}/mo vs ${fmtMoney(Math.round(bench))}/mo benchmark (28% of gross).`, dps:['dest_median_home','dest_rent2','dest_prop_tax','inp_salary','inp_target_price']};
  }},
  job:{label:'Job Market', icon:'brief', calc:(inp,o,d)=>{
    const score = mrClamp(62 + 9*(MR_NATL.unemp - d.unemp) + 2.4*d.jobs5);
    return {score, formula:'clamp(62 + 9 × (national unemployment − metro unemployment) + 2.4 × 5-yr employment growth %)', expl:`Metro unemployment ${d.unemp}% vs ${MR_NATL.unemp}% national; ${d.jobs5}% five-year employment growth.`, dps:['dest_unemp','natl_unemp','dest_jobs5']};
  }},
  commute:{label:'Commute', icon:'truck', calc:(inp,o,d)=>{
    if(!d.hoods.length) return {blocked:'No neighborhood travel-time data for this destination in the prototype dataset.'};
    const best = Math.min(...d.hoods.map(h=>h.min));
    const avg = Math.round(d.hoods.reduce((s,h)=>s+h.min,0)/d.hoods.length);
    const score = mrClamp(100 - 2.4*Math.max(0, avg-10) - (avg>inp.maxCommute?20:0));
    return {score, val:avg, formula:'clamp(100 − 2.4 × (avg recommended-neighborhood commute − 10 min) − 20 if avg exceeds stated max)', expl:`Average ${avg} min across recommended neighborhoods (best ${best} min) vs your ${inp.maxCommute}-min preference.`, dps:['dest_hood_commutes','inp_max_commute']};
  }},
  schools:{label:'Schools', icon:'graduate', calc:(inp,o,d)=>{
    if(!d.schools.length) return {blocked:'No school data for this destination in the prototype dataset.'};
    const avg = d.schools.reduce((s,x)=>s+x.r,0)/d.schools.length;
    return {score:mrClamp(avg*10), val:avg, formula:'clamp(mean district-framework rating × 10)', expl:`Average rating ${avg.toFixed(1)}/10 across ${d.schools.length} profiled schools (fictional district framework).`, dps:['dest_schools']};
  }},
  taxes:{label:'Taxes', icon:'scale', calc:(inp,o,d)=>{
    const dRate = d.stTax + (inp.targetPrice||d.home)*(d.propTax/100)/inp.salary*100;
    const oRate = o ? o.stTax + o.home*(o.propTax/100)/inp.salary*100 : null;
    const score = mrClamp(74 + (oRate!==null ? 2.6*(oRate-dRate) : -0.9*(dRate-6)));
    return {score, val:dRate, formula:'clamp(74 + 2.6 × (origin combined eff. rate − destination combined eff. rate))', expl:`Destination combined state income + property tax ≈ ${dRate.toFixed(1)}% of salary${oRate!==null?` vs ${oRate.toFixed(1)}% at origin`:''}.`, dps:['dest_state_tax','dest_prop_tax','orig_state_tax','inp_salary']};
  }},
  lifestyle:{label:'Lifestyle', icon:'smile', calc:(inp,o,d)=>{
    const picks = inp.priorities.filter(p=>d.life[p]!=null);
    if(!picks.length) return {blocked:'No lifestyle index data for the selected priorities.'};
    const avg = picks.reduce((s,p)=>s+d.life[p],0)/picks.length;
    return {score:mrClamp(avg), picks, formula:'clamp(mean of destination index values for the customer-selected priorities)', expl:`Averaged across your ${picks.length} selected priorities: ${picks.join(', ')}.`, dps:['dest_lifestyle_idx','inp_priorities']};
  }},
  airport:{label:'Airport Access', icon:'send', calc:(inp,o,d)=>{
    const score = mrClamp(106 - 1.7*d.airMin);
    return {score, val:d.airMin, formula:'clamp(106 − 1.7 × drive minutes to primary commercial airport)', expl:`${d.air} is ~${d.airMin} min from the recommended area.`, dps:['dest_airport_min']};
  }},
  climate:{label:'Climate', icon:'globe', calc:(inp,o,d)=>{
    /* Temperature only. This used to weight `sunny`, which was never a sunshine
       measurement: it counted days under 0.1in of precipitation. Nothing here
       observes sunshine or cloud cover, so nothing here scores it. */
    const score = mrClamp(78 - 1.1*Math.max(0,d.sumHi-91) - 0.7*Math.max(0,25-d.winLo));
    return {score, formula:'clamp(78 − 1.1 × summer-high excess over 91°F − 0.7 × winter-low shortfall under 25°F)', expl:`typical summer high ${d.sumHi}°F, winter low ${d.winLo}°F, from observed daily records rather than 30-year normals`, dps:['dest_climate']};
  }},
  healthcare:{label:'Healthcare', icon:'steth', calc:(inp,o,d)=>{
    const score = mrClamp(52 + 4.4*d.hosp30 - 0.7*d.hospMin);
    return {score, formula:'clamp(52 + 4.4 × qualifying hospitals within 30 min − 0.7 × minutes to nearest)', expl:`${d.hosp30} qualifying hospitals within 30 minutes; nearest ~${d.hospMin} min.`, dps:['dest_hospitals','dest_hosp_min']};
  }},
  safety:{label:'Safety', icon:'shield', calc:()=>({blocked:'Composite safety scoring is blocked until the weighting methodology is documented and approved. Objective source data (FBI CDE, FEMA NRI) will display without a score.'})},
};
const MR_CAT_KEYS = ['housing','job','commute','schools','taxes','lifestyle','airport','climate','healthcare','safety'];

/* Categories that would otherwise be computed from mrFallbackProfile()'s generic
   national constants. For a destination outside the curated dataset those numbers
   are not real for that city, so we BLOCK them rather than presenting a confident
   score built on placeholders. Climate is exempt: it is fetched live per coordinate. */
const MR_FALLBACK_BLOCKED = ['housing','job','taxes','lifestyle','airport','healthcare'];

function mrComputeScores(inp){
  const d = MR_DATA[inp.dest], o = MR_DATA[inp.origin]||null;
  const out = {};
  MR_CAT_KEYS.forEach(k=>{ out[k] = Object.assign({key:k,label:MR_CALCS[k].label,icon:MR_CALCS[k].icon}, MR_CALCS[k].calc(inp,o,d)); });
  /* Safety net: a category whose score is not a finite number is a bug, not a zero.
     Block it rather than rendering NaN or a misleading value to a customer. */
  MR_CAT_KEYS.forEach(k=>{
    const c = out[k];
    if(!c.blocked && !Number.isFinite(c.score)){
      out[k] = {key:k, label:MR_CALCS[k].label, icon:MR_CALCS[k].icon,
        blocked:'This category could not be calculated from the available data and has been left unscored.'};
      if(window.console) console.warn('[market-report] non-finite score for category:', k);
    }
  });
  if(d && d._fallback){
    MR_FALLBACK_BLOCKED.forEach(k=>{
      out[k] = {key:k, label:MR_CALCS[k].label, icon:MR_CALCS[k].icon,
        blocked:'No verified market data for this destination yet. Arrival covers this category once a licensed data provider is connected for this metro. It is left unscored rather than estimated.'};
    });
  }
  const eligible = MR_CAT_KEYS.map(k=>out[k]).filter(c=>!c.blocked);
  /* An "overall relocation score" averaged from one or two surviving categories
     is more misleading than no score at all. Require a quorum. */
  const MR_MIN_CATS = 4;
  const overall = eligible.length >= MR_MIN_CATS
    ? Math.round(eligible.reduce((s,c)=>s+c.score,0)/eligible.length)
    : null;
  /* 5-yr HISTORICAL appreciation, a labeled historical metric, NOT a forecast.
     Forward-looking forecasts are blocked until an approved model or licensed
     provider forecast exists (see methodology). */
  const hist5 = d.hist5;
  /* Estimated monthly difference (deterministic, labeled estimate) */
  let savings = null, savingsExpl = '';
  if(o){
    const basket = 0.62*inp.salary/12; // documented assumption: non-housing spend basket
    const colAdj = basket*(o.rpp-d.rpp)/o.rpp;
    const oMonthly = inp.mode==='Renter' ? o.rent2 : mrMortgage(o.home, inp.rate, inp.term, inp.downPct)+o.home*(o.propTax/100)/12+o.home*0.0035/12;
    const dMonthly = inp.mode==='Renter' ? d.rent2 : mrMortgage(d.home, inp.rate, inp.term, inp.downPct)+d.home*(d.propTax/100)/12+d.home*0.0035/12;
    savings = Math.round(colAdj + (oMonthly-dMonthly));
    savingsExpl = `Non-housing basket (62% of gross) adjusted by RPP ${o.rpp}→${d.rpp} (${fmtMoney(Math.round(colAdj))}/mo) plus the median-home-to-median-home housing cost difference (${fmtMoney(Math.round(oMonthly-dMonthly))}/mo), a market comparison, independent of the personal target price used for affordability. Estimate only, not guaranteed savings.`;
  }
  return {cats:out, overall, hist5, savings, savingsExpl, eligibleCount:eligible.length, blockedCount:MR_CAT_KEYS.length-eligible.length};
}

    pts.push(dp('orig_state_tax','State income tax, origin',o.stTax,'%','Versioned tax rules (production)','State','Seeded demonstration value'));
  } else {
    pts.push({key:'orig_median_home',label:'Median home value, origin',value:null,unit:'USD',source:'—',prod:'RentCast (production)',geo:`Metro: ${inp.origin}`,period:'—',fetched:'—',method:'—',state:'unavailable'});
    pts.push({key:'orig_rpp',label:'Regional Price Parity, origin',value:null,unit:'index',source:'—',prod:'BEA RPP (production)',geo:`Metro: ${inp.origin}`,period:'—',fetched:'—',method:'—',state:'unavailable'});

/* ---- Confidence (documented formula) ---- */
/* Confidence must reflect how much of the report we could actually stand behind.
   A previous version counted only data-point presence, so a destination with 9 of 10
   categories BLOCKED still reported "99%, Very High Confidence". Category coverage is
   now the dominant term. */
function mrConfidence(rep){
  const req = rep.dataPoints.filter(p=>p.key!=='inp_target_price');
  const ok = req.filter(p=>p.state!=='unavailable').length;
  const completeness = req.length ? ok/req.length : 0;
  const providerOk = 1; // production: successful provider calls / attempted
  let coverage = 1;
  if(rep.scores && rep.scores.cats){
    const keys = Object.keys(rep.scores.cats);
    const scored = keys.filter(k=>!rep.scores.cats[k].blocked).length;
    coverage = keys.length ? scored/keys.length : 0;
  }
  const base = Math.round(100*(0.55*coverage + 0.30*completeness + 0.15*providerOk)) - 4*(rep.overrides||[]).length;
  return Math.max(5, Math.min(99, base));
}
function mrConfLabel(c){ return c>=95?'Very High Confidence':c>=88?'High Confidence':c>=70?'Moderate Confidence':'Low Confidence'; }

/* ---- Narratives: template-composed strictly from data points.
   (Production: grounded AI via callClaude with a post-generation
   validator; here composition guarantees grounding.) ---- */
function mrNarratives(rep){
  const inp = rep.inputs, sc = rep.scores, d = MR_DATA[inp.dest], o = MR_DATA[inp.origin];
  const first = inp.employee.split(' ')[0].replace('Dr.','').trim()||inp.employee;
  /* A narrative may only cite a category that actually produced a score. When a
     category is blocked its underlying numbers are placeholders, and repeating them
     in prose is exactly the "confident-looking fiction" this report must never do. */
  const okCat = k => !!(sc.cats[k] && !sc.cats[k].blocked);
  const bits = [];
  if(okCat('taxes') && o) bits.push(`a cost of living about ${Math.abs(((d.rpp-o.rpp)/o.rpp*100)).toFixed(0)}% ${d.rpp<o.rpp?'lower':'higher'} than ${inp.origin}`);
  if(okCat('job')) bits.push(`${d.jobs5}% five-year job growth`);
  if(okCat('commute') && sc.cats.commute.val) bits.push(`an average commute of ${sc.cats.commute.val} minutes across the recommended neighborhoods`);
  if(okCat('climate')) bits.push(`typical summer highs near ${d.sumHi}°F and winter lows near ${d.winLo}°F`);
  const blockedN = MR_CAT_KEYS.filter(k=>sc.cats[k] && sc.cats[k].blocked).length;
  const coverageNote = blockedN >= 5
    ? ` Arrival does not yet have verified market data for ${inp.dest.split(',')[0]}, so ${blockedN} of ${MR_CAT_KEYS.length} categories are left unscored rather than estimated. Your coordinator can commission a full market study for this destination.`
    : '';
  const savingsBit = (sc.savings!=null && okCat('housing'))
    ? ` After the move, ongoing monthly costs are estimated to run about ${fmtMoney(Math.abs(sc.savings))} ${sc.savings>=0?'lower':'higher'} than today. This is an estimate based on the inputs you provided.`
    : '';
  return {
    exec: bits.length
      ? `Based on your salary, commute preference, household, and lifestyle priorities, ${inp.dest} offers ${bits.join(', ')}.${savingsBit}${coverageNote}`
      : `We confirmed ${inp.dest} and pulled live location and weather data for it, but Arrival does not yet have verified market data for this destination, so no category has been scored.${coverageNote}`,
    housing: okCat('housing')
      ? `${inp.mode==='Renter'?`The median two-bedroom rent is ${fmtMoney(d.rent2)} per month`:`The median home value is ${fmtMoney(d.home)}, with about ${d.dom} days on market and ${d.inv} months of inventory`}. Prices have risen ${d.hist5}% over the past five years. That figure is historical, not a forecast.`
      : `Arrival does not yet have verified housing data for this destination. Rather than show an estimate, this section is left blank until a licensed housing data provider is connected for this metro.`,
    commute:sc.cats.commute.blocked?'':`The average drive to the ${inp.office||'destination office'} is ${sc.cats.commute.val} minutes across the recommended neighborhoods, and as little as ${Math.min(...d.hoods.map(h=>h.min))} minutes from the closest.`,
    recs:[
      d.hoods.length?`You prioritized ${inp.priorities.slice(0,2).join(' and ').toLowerCase()||'your selected criteria'}, and ${d.hoods[0].n} fits that best. It offers ${d.hoods[0].traits.toLowerCase()}.`:null,
      inp.remoteDays>0?`With ${inp.remoteDays} remote day${inp.remoteDays>1?'s':''} a week, areas a little further out such as ${d.hoods[1]?d.hoods[1].n:'the outer neighborhoods'} trade a longer commute for more space at a similar price.`:null,
    ].filter(Boolean),
    validation:'Every number in this report traces to a specific, dated data point, and anything estimated is labeled as an estimate. Written sections are checked so no unsupported figure can appear.',
  };
}

const MR_JOB_STEPS = [
  {k:'validate', l:'Input validation', calls:0},

function mrById(id){ return (S.marketReports||[]).find(r=>r.id===id); }
function mrByToken(tok){ return (S.marketReports||[]).find(r=>r.token===tok); }
function mrNewToken(){
  const a = new Uint8Array(10); crypto.getRandomValues(a);
  return 'rpt-'+Array.from(a).map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
}
function mrNextId(){
  const n = (S.marketReports||[]).map(r=>parseInt(r.id.split('-')[1],10)).filter(x=>!isNaN(x));
  return 'MR-'+(Math.max(...n, 1200)+1);
}
function mrLog(rep, text){ rep.audit = rep.audit||[]; rep.audit.unshift({ts:new Date().toISOString().slice(0,16).replace('T',' '), who:ccUser().name, text}); }

function mrRunPipeline(rep){
  /* Finite predefined plan, no open-ended loops, capped calls. */
  rep.status='collecting_data';
  rep.job = {steps:MR_JOB_STEPS.map(s=>({k:s.k,l:s.l,status:'pending'})), calls:{provider:0, ai:0}, caps:MR_CAPS, started:new Date().toISOString().slice(0,16).replace('T',' ')};
  mrLog(rep,'Generation started, finite plan of '+MR_JOB_STEPS.length+' steps, caps: '+MR_CAPS.provider+' provider calls / '+MR_CAPS.ai+' AI calls.');
  saveLocal(); route();
  let i = 0;
  const tick = ()=>{
    const R = mrById(rep.id); if(!R||!R.job) return;
    if(i>0) R.job.steps[i-1].status='done';
    if(i>=MR_JOB_STEPS.length){
      const inp = R.inputs;
      R.dataPoints = mrBuildDataPoints(inp);
      R.scores = mrComputeScores(inp);
      R.confidence = mrConfidence(R);
      R.narr = mrNarratives(R);
      R.job.finished = new Date().toISOString().slice(0,16).replace('T',' ');
      const missing = R.dataPoints.filter(p=>p.state==='unavailable');
      R.status = 'needs_review';
      R.reviewNotes = missing.length? [`${missing.length} data point(s) unavailable (${missing.map(m=>m.label).join('; ')}), dependent comparisons are omitted, confidence reduced.`] : [];
      if(R.scores.blockedCount) R.reviewNotes.push(`${R.scores.blockedCount} score categor${R.scores.blockedCount>1?'ies':'y'} blocked (see Scores), excluded from the overall score, never defaulted.`);
      mrLog(R,'Generation finished → needs_review. Provider calls: '+R.job.calls.provider+'/'+MR_CAPS.provider+', AI calls: '+R.job.calls.ai+'/'+MR_CAPS.ai+'.');
      saveLocal(); route(); return;
    }
    const st = MR_JOB_STEPS[i];
    R.job.steps[i].status='running';
    R.job.calls.provider += st.calls||0;
    if(st.ai) R.job.calls.ai += 1;
    i++; saveLocal();
    if(location.pathname.includes('/market-reports/')) route();
    setTimeout(tick, 420);
  };
  setTimeout(tick, 380);
}

function mrGauge(val, color){
  color = color || '#2E7D6B';

  const r=36, c=Math.PI*r, off=c*(1-pct);
  return `<svg viewBox="0 0 96 58" style="width:112px">

      <path d="M10 50 A 38 38 0 0 1 86 50" fill="none" stroke="url(#mrg${val})" stroke-width="8.5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>

}

function mrSkyline(city, label){
  // Deterministic per-city variation without Math.random (banned in this env)
  const seed = [...(city||'x')].reduce((a,c)=>a+c.charCodeAt(0),0);
  const rnd = n => ((seed*9301 + n*49297) % 233280) / 233280;
  // three depth layers of buildings
  const layer = (n, base, hMin, hMax, w, fill, op, jitter) => {
    let out = '', x = -4;
    for(let i=0;i<n;i++){
      const h = hMin + rnd(i*jitter)*(hMax-hMin);
      const bw = w + rnd(i*3+jitter)*8;
      const setback = rnd(i*7)>.68;
      out += `<rect x="${x.toFixed(1)}" y="${(base-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h+30).toFixed(1)}" fill="${fill}" opacity="${op}"/>`;
      if(setback) out += `<rect x="${(x+bw*.28).toFixed(1)}" y="${(base-h-6-rnd(i)*6).toFixed(1)}" width="${(bw*.44).toFixed(1)}" height="10" fill="${fill}" opacity="${op}"/>`;
      if(rnd(i*5)>.72) out += `<rect x="${(x+bw*.5-.5).toFixed(1)}" y="${(base-h-9).toFixed(1)}" width="1" height="9" fill="${fill}" opacity="${op}"/>`;
      x += bw - 1.5;
    }
    return out;
  };
  const wins = (n, base, hMin, hMax, w, jitter) => {
    let out = '', x = -4;
    for(let i=0;i<n;i++){
      const h = hMin + rnd(i*jitter)*(hMax-hMin), bw = w + rnd(i*3+jitter)*8;
      for(let c=0;c<Math.floor(bw/4);c++) for(let r=0;r<Math.floor(h/5);r++){
        if(rnd(i*31+c*7+r*3)>.5) out += `<rect x="${(x+3+c*4).toFixed(1)}" y="${(base-h+4+r*5).toFixed(1)}" width="1.7" height="2.2" fill="#F4CE6B" opacity="${(.5+rnd(c+r)*.5).toFixed(2)}"/>`;
      }
      x += bw - 1.5;
    }
    return out;
  };
  return `<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%;display:block">
    <defs>
      <linearGradient id="mrsky${seed}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0A1730"/><stop offset=".42" stop-color="#1D3357"/><stop offset=".7" stop-color="#5A5A86"/><stop offset=".86" stop-color="#C88E52"/><stop offset="1" stop-color="#E9B65C"/>
      </linearGradient>
      <radialGradient id="mrmoon${seed}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FBE9B8"/><stop offset=".55" stop-color="#F3D48A" stop-opacity=".9"/><stop offset="1" stop-color="#F3D48A" stop-opacity="0"/></radialGradient>
      <linearGradient id="mrwater${seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123056"/><stop offset="1" stop-color="#0C2038"/></linearGradient>
    </defs>
    <rect width="200" height="120" fill="url(#mrsky${seed})"/>
    <circle cx="${150+Math.round(rnd(2)*30)}" cy="30" r="26" fill="url(#mrmoon${seed})"/>
    <circle cx="${150+Math.round(rnd(2)*30)}" cy="30" r="9" fill="#FCEFC8"/>
    ${layer(9, 92, 20, 40, 22, '#2A3F63', .55, 11)}
    ${layer(11, 94, 30, 62, 18, '#152A4B', .82, 17)}
    ${layer(13, 96, 24, 78, 15, '#0B1B34', 1, 23)}
    ${wins(13, 96, 24, 78, 15, 23)}
    <rect y="96" width="200" height="24" fill="url(#mrwater${seed})"/>
    <rect y="95.5" width="200" height="1.4" fill="#C88E52" opacity=".5"/>
    ${[18,44,78,110,150,182].map((x,i)=>`<rect x="${x}" y="97" width="1.6" height="${8+rnd(i)*9}" fill="#F4CE6B" opacity=".28"/>`).join('')}
    ${label?`<text x="8" y="112" font-size="6.4" fill="#fff" opacity=".8" font-weight="600" font-family="Inter,sans-serif">${esc(city)} · original illustration</text>`:''}
  </svg>`;
}

function mrQR(url){
  try{

function mrTrendChart(d){
  const now = d.home, start = Math.round(now/(1+d.hist5/100));
  const pts = [0,1,2,3,4,5].map(i=>Math.round(start*Math.pow(now/start, i/5)));
  const min = start*0.94, max = now*1.04;
  const X = i=>10+i*22, Y = v=>46-40*((v-min)/(max-min));
  return `<svg viewBox="0 0 130 56" style="width:100%">
    ${[0,1,2,3].map(i=>`<line x1="10" x2="120" y1="${8+i*12}" y2="${8+i*12}" stroke="#EFF2F7"/>`).join('')}
    <polyline points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}" fill="none" stroke="#2C5AA0" stroke-width="2"/>
    ${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="1.9" fill="#B98A2E"/>`).join('')}
    ${pts.map((v,i)=>`<text x="${X(i)}" y="54" text-anchor="middle" font-size="4.6" fill="#7C8798">’${21+i}</text>`).join('')}
  </svg>
  <div class="mr-tiny" style="margin-top:2px">Based on the five-year historical appreciation figure (${d.hist5}%). Historical, not a forecast.</div>`;
}

function mrScoreTiles(rep){

  const tile = (color, iconKey, label, bodyHTML) =>
    `<div class="mr-tile"><span class="mr-ti" style="background:${mrHex(color,.13)};color:${color}">${MR_ICON(iconKey)}</span><div class="mr-lab">${label}</div>${bodyHTML}</div>`;
  const tiles = MR_CAT_KEYS.map(k=>{
    const c = sc.cats[k], col = MR_CAT_COLOR[k]||'#13294B';
    if(c.blocked) return tile(col, k, c.label, `<b style="font-size:12.5px;color:#B08636;line-height:1.2">Pending<br><span style="font-weight:600;font-size:8.5px;color:#8A94A6">data provider</span></b>`);
    return tile(col, k, c.label, `<b style="color:${mrScoreColor(c.score)}">${c.score}</b>`);
  });
  tiles.push(tile(MR_CAT_COLOR.hist, 'hist', '5-Yr Historical Appreciation', `<b style="font-size:18px;color:#1F7A44">+${sc.hist5}%</b><div class="mr-tiny">historical</div>`));

    : tile(MR_CAT_COLOR.savings, 'savings', 'Est. Monthly Difference', `<b style="font-size:11px;color:#B08636">Unavailable</b><div class="mr-tiny">origin data missing</div>`));
  return tiles.join('');
}

  try{

/* Resolve a typed destination to a known dataset key (rich report), else null */
/* Binds a reference dataset to the location the SERVER confirmed, never to what
   the visitor typed.
   This matched on city name alone, so "Austin, MN" loaded the Austin, TEXAS
   dataset: Minnesota photo and climate presented alongside Texas house prices,
   taxes, schools and neighbourhoods, and because a curated dataset was found the
   fallback blocking never engaged, so it published at 95% confidence.
   `canonicalKey` is `dest.key` from the API ("City, ST"). With no confirmed key
   there is no dataset, which forces the blocked/estimate path. */
function mrResolveDataset(canonicalKey){
  if(!canonicalKey) return null;
  const k = String(canonicalKey).trim();
  return (MR_DATA[k] && MR_DATA[k].hoods) ? k : null;
}
function mrFallbackProfile(){
  // Neutral US-metro reference midpoints, clearly badged as estimates on the
  // report. No invented neighborhoods or schools (those sections show empty).
  return {home:395000, rent2:1750, dom:36, inv:2.8, hist5:28.0, rpp:98.0, unemp:3.9, jobs5:5.5,
    stTax:4.5, propTax:1.0, sunny:205, sumHi:88, winLo:30, precip:42.0, hosp30:6, hospMin:14,
    air:'Nearest commercial airport', airMin:22,
    life:{Golf:70,'Hiking & outdoors':72,'Dining':76,'Arts & culture':73,'Parks & trails':75,'Nightlife':72,'Walkability':52},
    hoods:[], schools:[], _fallback:true};
}
function mrBuildLiveReport(inp, data){
  /* Only the server's canonical "City, ST" may select a dataset. If the agent
     could not confirm a state, there is no dataset and every reference figure
     is blocked rather than borrowed from a same-named city elsewhere. */
  const confirmedKey = (data && data.ok && data.dest && data.dest.key) ? data.dest.key : null;
  const destKey = mrResolveDataset(confirmedKey);
  const base = destKey ? JSON.parse(JSON.stringify(MR_DATA[destKey])) : mrFallbackProfile();
  const live = {photo:null, climate:null, coords:null, providers:(data&&data.providers)||null, dataset: destKey?'reference':'fallback'};
  if(data && data.ok){
    // NOTE: the agent renamed `sunny` to `dryDays` (it counts days under 0.1in of
    // precipitation, it does not measure sunshine). Accept both so an older cached
    // response cannot silently produce a NaN score.
    if(data.climate){
      const dry = (data.climate.dryDays != null) ? data.climate.dryDays : data.climate.sunny;
      if(dry != null) base.dryDays = dry;
      if(data.climate.sumHi != null) base.sumHi = data.climate.sumHi;
      if(data.climate.winLo != null) base.winLo = data.climate.winLo;
      if(data.climate.precip != null) base.precip = data.climate.precip;
      live.climate = data.climate;
    }
    if(data.photo) live.photo=data.photo;
    if(data.dest) live.coords={lat:data.dest.lat, lon:data.dest.lon, name:data.dest.name, state:data.dest.state};
    if(data.dest && data.dest.air) base.air = base.air; // keep dataset airport label
  }
  /* From here the report speaks in the CONFIRMED city, not the typed one. The
     report header, the score engine and the cache key all use it, so a report
     can never be titled with a place the agent did not resolve. */
  const destLabel = confirmedKey || inp.dest.trim();
  MR_DATA[destLabel] = base;
  const inputs = {
    employee:inp.employee.trim(), company:inp.company.trim()||'Self / Direct', title:inp.title.trim(),
    origin:inp.origin.trim(), dest:destLabel, office:inp.office.trim(),
    salary:parseInt(inp.salary,10)||150000, mode:inp.mode, targetPrice:parseInt(inp.targetPrice,10)||null,
    downPct:parseFloat(inp.downPct)||20, rate:parseFloat(inp.rate)||6.5, term:parseInt(inp.term,10)||30,
    maxCommute:parseInt(inp.maxCommute,10)||30, remoteDays:parseInt(inp.remoteDays,10)||0,
    household:inp.household, schoolImportance:inp.schoolImportance, setting:inp.setting,
    airportImportance:inp.airportImportance, beds:inp.beds, priorities:inp.priorities,
    coordinator:'Arrival Concierge', recipient:inp.recipient, expiry:'30 days',
  };
  const rep = {
    id:mrNextId(), token:mrNewToken(), status:'needs_review', inputs, live,
    created:new Date().toISOString().slice(0,10), createdBy:'Website. Try It Live', version:null,
    revoked:false, overrides:[], aiRegens:0,
    job:{steps:MR_JOB_STEPS.map(s=>({k:s.k,l:s.l,status:'done'})), calls:{provider:(live.photo?1:0)+(live.climate?1:0)+2, ai:1}, caps:MR_CAPS, started:'live', finished:'live'},
    delivery:[], audit:[{ts:new Date().toISOString().slice(0,16).replace('T',' '),who:'Arrival Agent',text:`Live run, ${live.photo?'real photo':'no photo'}, ${live.climate?'real climate':'no climate'} pulled for ${inp.dest}.`}],
  };
  rep.dataPoints = mrBuildDataPoints(inputs);
  // mark the live fields with real provenance
  if(live.climate){ /* Must match the key set in mrBuildDataPoints. It looked for the old
       'dest_climate_normals' after the rename, silently found nothing, and left
       genuine live readings marked as reference data. */
      const dp=rep.dataPoints.find(p=>p.key==='dest_climate'); if(dp){ dp.source=live.climate.source; dp.prod='Open-Meteo (LIVE)'; dp.period=live.climate.period; dp.fetched=(data.generatedAt||'').slice(0,16).replace('T',' '); dp.method='Live 3-yr daily readings → normals'; dp.state='live'; } }
  rep.scores = mrComputeScores(inputs);
  rep.confidence = mrConfidence(rep);
  rep.narr = mrNarratives(rep);
  if(!destKey) rep.reviewNotes = ['Destination is outside the seeded metro set, housing, jobs, taxes and lifestyle are reference estimates (photo & climate are live). Connect RentCast/Census/BLS to make every figure live.'];
  S.marketReports = S.marketReports || []; S.marketReports.unshift(rep); saveLocal();
  return rep;
}

function mrApprove(id){
  const r=mrById(id); if(!r||r.status!=='needs_review') return;
  confirmModal('Approve this report?', `Approving freezes <b>version ${(r.version||0)+1}</b> as an immutable snapshot and unlocks delivery to ${esc(r.inputs.recipient)}.<br><br><span class="tiny" style="color:var(--gold-deep)">Score model ${MR_SCORE_MODEL.name} v${MR_SCORE_MODEL.version} is a DRAFT, production approval requires Arrival-approved weights.</span>`, 'Approve', ()=>{
    r.status='approved'; r.version=(r.version||0)+1; r.approvedBy=ccUser().name; r.approvedAt=new Date().toISOString().slice(0,10);
    mrLog(r,'Version '+r.version+' approved. Draft score model acknowledged.');
    save(); toast('Report approved','Version '+r.version+' frozen, ready to send.','ok'); route();
  });
}
function mrSend(id){
  const r=mrById(id); if(!r) return;
  if(!['approved','ready_to_send','sent'].includes(r.status)){ toast('Not approved','Reports must be reviewed and approved before sending.','err'); return; }
  if(r.revoked){ toast('Link revoked','Issue a new secure link before sending.','err'); return; }
  confirmModal('Send report?', `Simulated email to <b>${esc(r.inputs.recipient)}</b> with the secure link and PDF. Production: Resend, approval-gated, size-checked attachment, delivery ID logged.`, 'Send (simulated)', ()=>{
    const ts=new Date().toISOString().slice(0,16).replace('T',' ');
    r.delivery=r.delivery||[]; r.delivery.unshift({ts, to:r.inputs.recipient, status:'Delivered (simulated)', id:'dlv-sim-'+Math.random().toString(36).slice(2,7)});
    r.status='sent'; r.sentAt=ts; mrLog(r,'Report sent (simulated) to '+r.inputs.recipient+'.');
    save(); toast('Sent (simulated)','Secure link + PDF delivered to '+r.inputs.recipient+'.','ok'); route();

}
function mrRevoke(id){
  const r=mrById(id); if(!r) return;
  confirmModal('Revoke secure link?','The recipient link stops working immediately. You can issue a new link afterwards.','Revoke', ()=>{
    r.revoked=true; mrLog(r,'Secure link revoked.'); save(); toast('Access revoked','The report link no longer resolves.','ok'); route();
  }, true);
}
function mrReissue(id){
  const r=mrById(id); if(!r) return;
  r.token=mrNewToken(); r.revoked=false; mrLog(r,'New secure link issued (old token invalidated).');
  save(); toast('New link issued','Copy the new secure link to share it.','ok'); route();
}
function mrRegen(id){
  const r=mrById(id); if(!r||!r.scores) return;
  if((r.aiRegens||0)>=MR_CAPS.ai){ toast('AI call cap reached','This report has used its '+MR_CAPS.ai+'-call narrative budget.','err'); return; }
  r.aiRegens=(r.aiRegens||0)+1; if(r.job) r.job.calls.ai=Math.min(MR_CAPS.ai, r.job.calls.ai+1);
  r.narr=mrNarratives(r); mrLog(r,'Narrative regenerated ('+r.aiRegens+'/'+MR_CAPS.ai+'), grounding validator passed.');
  save(); toast('Narrative regenerated','Grounded against approved data points.','ok'); route();
}
function mrOverride(id, idx){
  const r=mrById(id); const p=r&&r.dataPoints[idx]; if(!p) return;
  openModal(`
    <div class="modal-h"><h3 style="font-size:17px">Override, ${esc(p.label)}</h3><button class="x" onclick="closeModal()">${ic('x','ic-sm')}</button></div>

      <p class="tiny muted">Overrides lower the confidence score and are visible in the methodology view.</p>
    </div>
    <div class="modal-f"><button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn btn-navy btn-sm" onclick="mrOverrideGo('${id}',${idx})">Apply override</button></div>`);

function mrOverrideGo(id, idx){
  const r=mrById(id); const p=r.dataPoints[idx];
  const val=document.getElementById('mro-val').value.trim(), why=document.getElementById('mro-why').value.trim();
  if(!val||!why){ toast('Reason required','Both a new value and a reason are required.','err'); return; }
  r.overrides=r.overrides||[]; r.overrides.push({key:p.key, orig:p.value, val, reason:why, user:ccUser().name, ts:new Date().toISOString().slice(0,16).replace('T',' ')});
  p.value=isNaN(parseFloat(val))?val:parseFloat(val); p.state='overridden';
  r.confidence=mrConfidence(r); mrLog(r,'Override on '+p.key+', "'+why+'"');
  save(); closeModal(); toast('Override applied','Logged with reason; confidence recalculated.','ok'); route();
}

function demoSignIn(roleKey){
  const u = DEMO_USERS[roleKey]; if(!u) return;

  /* Same opening as a real sign-in. A magic-link return spends a beat on
     bootSplash() while Auth.restore() and the first load run; the demo has
     nothing to wait for, so without this it snaps straight into a populated
     workspace and reads as a different product. Show the same screen. */
  const app = document.getElementById('app');
  if(app) app.innerHTML = bootSplash();

  DEMO = true;
  ME = Object.assign({}, u, {at:Date.now()});
  AUTH_STATE = 'ok';
  setViewAs(null);
  demoSeed();
  try{ sessionStorage.setItem(LS_DEMO, roleKey); }catch(e){}

  setTimeout(()=>{
    nav(roleHome(ME.role));
    toast('Demo workspace open', u.name + ' — ' + u.org + '. Every record here is fictional.', 'ok');
  }, 5000);
}

function demoRestore(){
  let k = null; try{ k = sessionStorage.getItem(LS_DEMO); }catch(e){}
  if(!k || !DEMO_USERS[k]) return false;
  DEMO = true;
  ME = Object.assign({}, DEMO_USERS[k], {at:Date.now()});
  demoSeed();
  return true;
}

function demoEnd(){
  DEMO = false;
  try{ sessionStorage.removeItem(LS_DEMO); }catch(e){}
  clearSession();
}

async function boot(){
  const first = curPath();
  if(!PORTALS_ENABLED || !isPortalPath(first)){ route(); }
  else { document.getElementById('app').innerHTML = bootSplash(); }

  if(!PORTALS_ENABLED){ AUTH_STATE = 'signed_out'; return; }

  /* A demo session outranks the real one: it is explicit, per-tab, and never
     touches the network. */
  if(demoRestore()){
    AUTH_STATE = 'ok';
    const app = document.getElementById('app');
    if(app && isPortalPath(curPath())) app.innerHTML = bootSplash();
    setTimeout(route, 450);
    return;
  }

  const r = await Auth.restore();
  AUTH_STATE = r.state;
  if(r.state === 'ok'){
    const load = await Data.loadAll();
    if(!load.ok){
      AUTH_STATE = 'error';
      console.error('[boot] data load failed', load.error);
    }
  }
  route();

  // Keep the tab honest if the session ends in another tab or a token expires.
  const c = sb();
  if(c) c.auth.onAuthStateChange(async (evt)=>{
    if(evt === 'SIGNED_OUT'){ AUTH_STATE = 'signed_out'; clearSession(); route(); }
    if(evt === 'SIGNED_IN' && !ME){
      const rr = await Auth.restore(); AUTH_STATE = rr.state;
      if(rr.state === 'ok'){
        /* Inspect the result exactly as boot() does. Ignoring it meant a
           transient RLS or network failure rendered an empty but otherwise
           normal-looking portal, which reads as "you have no relocations". */
        const load = await Data.loadAll();
        if(!load.ok){ AUTH_STATE = 'error'; console.error('[auth] data load failed', load.error); }
      }
      route();
    }
  });
}

function bootSplash(){
  return `<div style="min-height:70vh;display:flex;align-items:center;justify-content:center">
    <div style="text-align:center">
      <div style="display:flex;justify-content:center;margin-bottom:16px">${logoMark(38)}</div>
      <span class="spin" style="border-color:rgba(19,41,75,.2);border-top-color:var(--navy)"></span>
      <p class="small muted" style="margin-top:12px">Opening your workspace…</p>
    </div>
  </div>`;
}

/* An account with no profile is an address that was never invited. Say so
   plainly instead of dropping them into a portal with nothing in it, which
   reads as a broken product. */
/* The workspace could not be reached. Say that, rather than rendering an empty
   portal that looks like a customer with no relocations. */
function pageWorkspaceDown(app){
  app.innerHTML = pubNav() + `<main class="fade-in"><section style="padding:70px 0"><div class="wrap" style="max-width:560px">
    <div class="card card-pad" style="text-align:center">
      <div class="icbox navy" style="width:56px;height:56px;margin:0 auto;border-radius:50%">${ic('alert','ic-lg')}</div>
      <h2 class="serif" style="font-size:26px;margin-top:16px">We could not open your workspace</h2>
      <p class="small muted" style="margin-top:10px">This is on our side, not yours, and your data is unaffected.
      Please try again in a moment. If it keeps happening, contact your Arrival coordinator.</p>
      <div class="flex gap8" style="justify-content:center;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-navy btn-sm" onclick="location.reload()">Try again</button>
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign out</button>
      </div>
    </div>
  </div></section></main>` + pubFooter();
}

function pageNoAccess(app){
  app.innerHTML = pubNav() + `<main class="fade-in"><section style="padding:70px 0"><div class="wrap" style="max-width:560px">
    <div class="card card-pad" style="text-align:center">
      <div class="icbox navy" style="width:56px;height:56px;margin:0 auto;border-radius:50%">${ic('lock','ic-lg')}</div>
      <h2 class="serif" style="font-size:26px;margin-top:16px">This address has no workspace yet</h2>
      <p class="small muted" style="margin-top:10px">You are signed in, but no Arrival workspace is linked to this email.
      Workspaces are set up by an Arrival coordinator. If you were expecting access, reply to your coordinator and they will add you.</p>
      <div class="flex gap8" style="justify-content:center;margin-top:20px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign out</button>
        <a class="btn btn-navy btn-sm" href="/contact" data-nav>Contact Arrival</a>
      </div>
    </div>
  </div></section></main>` + pubFooter();
}

boot();

</script>
</body>
