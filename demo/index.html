<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Indexing is decided at runtime: the production host (arrivalrelopartners.com)
     should be found in search; the FGA prototype host must never be indexed. -->
<meta name="robots" id="robots-meta" content="index, follow" />
<link rel="canonical" id="canonical-link" href="https://www.arrivalrelopartners.com/" />
<meta property="og:site_name" content="Arrival Relocation Partners" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Arrival Relocation Partners, Corporate Relocation Made Personal" />
<meta property="og:description" content="Give relocating employees a trusted local real estate expert, and give your team complete visibility from intake through closing." />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%23172D52%27/%3E%3Cg transform=%27translate(0,11)%27%3E%3Cpath d=%27M50 8 L82 79 L71 79 L50 34 L29 79 L18 79 Z%27 fill=%27%23FFFFFF%27/%3E%3Cpath d=%27M8 68 Q28 48 50 47 Q72 48 92 68 Q72 55 50 54 Q28 55 8 68 Z%27 fill=%27%23FFFFFF%27/%3E%3C/g%3E%3C/svg%3E">
<title>Arrival Relocation Partners. Corporate Relocation, Made Personal.</title>
<meta name="description" content="Arrival Relocation Partners connects relocating employees with vetted local real estate experts nationwide, with one coordinator per move and full visibility from intake through closing." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#172D52; --midnight:#0B1B36; --deep:#091427;
  --brand-gold:#C0A369; --gold:#2C5AA0; --gold-deep:#1B3E73; --gold-soft:#D3E0F2;
  --ivory:#F5F8FC; --paper:#FFFFFF; --warm:#FAFCFE;
  --ink:#1C2B42; --slate:#5C6B81; --mist:#8B97A8;
  --line:#E3E8F0; --line-navy:rgba(19,41,75,.12);
  --teal:#2E7D6B; --teal-soft:#E2EFEB;
  --amber:#B97A1F; --amber-soft:#F6ECDA;
  --red:#A8432F; --red-soft:#F5E4DF;
  --blue-soft:#E5EAF3;
  --shadow-sm:0 1px 2px rgba(11,27,54,.05), 0 1px 6px rgba(11,27,54,.04);
  --shadow:0 2px 8px rgba(11,27,54,.06), 0 12px 32px rgba(11,27,54,.08);
  --shadow-lg:0 6px 18px rgba(11,27,54,.10), 0 28px 64px rgba(11,27,54,.16);
  --r:12px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{background:var(--ivory);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--ink)}
h1,h2,h3,h4{line-height:1.18;font-weight:700;color:var(--navy)}
.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.005em}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-deep)}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--gold)}
.eyebrow.center::after{content:'';width:26px;height:1px;background:var(--gold)}
.lede{color:var(--slate);font-size:17px;max-width:640px}
.gold-rule{width:54px;height:2px;background:linear-gradient(90deg,var(--gold),rgba(44,90,160,.25));border:none;margin:18px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:600;font-size:14.5px;padding:13px 24px;border-radius:8px;transition:all .18s ease;white-space:nowrap;letter-spacing:.01em}
.btn-gold{background:var(--gold);color:#FFFFFF;box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 6px 18px rgba(44,90,160,.30)}
.btn-gold:hover{background:#3A6FBF;transform:translateY(-1px)}
.btn-navy{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(19,41,75,.22)}
.btn-navy:hover{background:#1A3560;transform:translateY(-1px)}
.btn-outline{border:1px solid var(--line-navy);color:var(--navy);background:rgba(255,255,255,.65)}
.btn-outline:hover{border-color:var(--navy);background:#fff}
.btn-outline-light{border:1px solid var(--line-navy);color:var(--navy);background:rgba(255,255,255,.7)}
.btn-outline-light:hover{border-color:var(--navy);background:#fff}
.btn-ghost{color:var(--slate);font-weight:600;padding:10px 14px;border-radius:8px;white-space:nowrap}
.btn-ghost:hover{color:var(--navy);background:rgba(19,41,75,.05)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:7px}
.btn-xs{padding:5px 11px;font-size:12px;border-radius:6px;font-weight:600}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn-gold .spin{border-color:rgba(255,255,255,.35);border-top-color:#FFFFFF}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px;border:1px solid var(--line-navy);color:var(--slate);background:#fff}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-navy{background:var(--blue-soft);color:var(--navy)}
.b-gold{background:#E4EDF9;color:var(--gold-deep)}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-gray{background:#EAEEF4;color:var(--slate)}

/* ---------- cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card-pad{padding:24px}
.card-hover{transition:all .2s ease}
.card-hover:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--gold-soft)}
.section{padding:96px 0}
.section-tight{padding:72px 0}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.muted{color:var(--slate)}.small{font-size:13px}.tiny{font-size:12px}
.flex{display:flex;align-items:center}.between{justify-content:space-between}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.num{font-variant-numeric:tabular-nums}

/* ---------- public nav ---------- */
.pnav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:all .2s}
.pnav .inner{display:flex;align-items:center;justify-content:space-between;height:74px}
.pnav nav{display:flex;align-items:center;gap:4px}
.pnav nav a{font-size:14px;font-weight:600;color:var(--slate);padding:9px 13px;border-radius:8px;transition:all .15s;white-space:nowrap}
.pnav nav a:hover,.pnav nav a.on{color:var(--navy);background:rgba(19,41,75,.05)}
.hamb{display:none;flex-direction:column;gap:5px;padding:10px}
.hamb span{width:22px;height:2px;background:var(--navy);border-radius:2px;transition:all .2s}
.mobile-menu{display:none;background:var(--warm);border-bottom:1px solid var(--line);padding:14px 28px 22px}
.mobile-menu a{display:block;padding:12px 6px;font-weight:600;color:var(--navy);border-bottom:1px solid var(--line)}
.mobile-menu.open{display:block}

/* ---------- logo ---------- */
/* The wordmark is part of the supplied logo image now, so the CSS that used to
   set "ARRIVAL / RELOCATION PARTNERS" in type is gone. Do not reinstate it: it
   never matched the real letterforms. See logo() below. */
.logo{display:inline-flex;align-items:center}

/* ---------- hero ---------- */
.hero{position:relative;background:linear-gradient(168deg,#FFFFFF 0%,#F4F8FD 58%,var(--blue-soft) 100%);color:var(--ink);overflow:hidden;border-bottom:1px solid var(--line)}
.hero::before{content:'';position:absolute;inset:0;background:
  radial-gradient(1100px 480px at 82% -10%,rgba(19,41,75,.06),transparent 60%),
  radial-gradient(700px 420px at -8% 110%,rgba(44,90,160,.08),transparent 60%)}
.hero-grid{position:absolute;inset:0;opacity:.04;background-image:linear-gradient(rgba(19,41,75,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(19,41,75,.6) 1px,transparent 1px);background-size:64px 64px}
.hero h1{color:var(--navy);font-size:clamp(38px,5.2vw,62px);line-height:1.06}
.hero h1 .gold{color:var(--gold-deep)}
.hero .lede{color:var(--slate)}
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.stat-strip>div{background:#fff;padding:18px 20px}
.stat-strip b{display:block;font-size:24px;font-weight:800;color:var(--navy)}
.stat-strip span{font-size:12px;color:var(--slate);letter-spacing:.04em}

/* ---------- tinted sections (formerly dark) ---------- */
.dark{background:linear-gradient(165deg,#F2F6FC,var(--blue-soft));color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.dark h2,.dark h3,.dark h4{color:var(--navy)}
.dark .muted,.dark .lede{color:var(--slate)}
.dark .card{background:#fff;border-color:var(--line);box-shadow:var(--shadow-sm)}

/* ---------- icons ---------- */
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}.ic-lg{width:26px;height:26px}
.icbox{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.icbox.gold{background:linear-gradient(150deg,#E4EDF9,#D3E0F2);color:var(--gold-deep);border:1px solid var(--gold-soft)}
.icbox.navy{background:var(--blue-soft);color:var(--navy);border:1px solid rgba(19,41,75,.10)}
.icbox.deep{background:var(--blue-soft);color:var(--navy);border:1px solid rgba(19,41,75,.12)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 14px;border-bottom:1px solid #EDF1F7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#F7FAFD}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:var(--navy)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:12.5px;font-weight:700;color:var(--navy);letter-spacing:.02em}
.field .req{color:var(--red)}
.in{border:1px solid var(--line);border-radius:9px;padding:11px 13px;background:#fff;transition:all .15s;width:100%}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(44,90,160,.18)}
.in.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(168,67,47,.12)}
textarea.in{resize:vertical;min-height:96px}
.ferr{font-size:12px;color:var(--red);font-weight:600}
.check{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--slate);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--navy);width:15px;height:15px}
.seg{display:inline-flex;background:#EAEFF5;border-radius:9px;padding:3px;gap:2px}
.seg button{padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--slate);border-radius:7px;transition:all .15s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow-sm)}

/* ---------- portal shell ---------- */
.shell{display:flex;min-height:100vh;background:var(--ivory)}
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);color:var(--ink);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s ease}
.side .brand{padding:22px 22px 18px;border-bottom:1px solid var(--line)}
.side nav{flex:1;overflow-y:auto;padding:14px 12px}
.side nav .nav-label{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);padding:16px 12px 7px}
.snav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--slate);margin-bottom:2px;transition:all .14s;position:relative}
.snav:hover{color:var(--navy);background:rgba(19,41,75,.05)}
.snav.on{color:var(--navy);background:var(--blue-soft);font-weight:600}
.snav.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--navy)}
.snav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--blue-soft);color:var(--navy);padding:1px 8px;border-radius:99px}
.snav.on .cnt{background:#fff}
.side .foot{padding:14px 16px;border-top:1px solid var(--line)}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 30px;height:66px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:18px}
.content{padding:28px 30px 70px;max-width:1240px;width:100%}
.iconbtn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--slate);border:1px solid transparent;transition:all .15s;position:relative}
.iconbtn:hover{background:#fff;border-color:var(--line);color:var(--navy)}
.iconbtn .ping{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--ivory)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,var(--navy),#2A4A7F);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none;letter-spacing:.02em}
.avatar.gold{background:linear-gradient(140deg,var(--gold-deep),var(--gold))}
.avatar.lg{width:52px;height:52px;font-size:16px}
.avatar.sm{width:28px;height:28px;font-size:10px}

/* KPI */
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .k-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mist);display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:27px;font-weight:800;color:var(--navy);margin-top:6px;line-height:1}
.kpi .k-sub{font-size:12px;color:var(--slate);margin-top:7px}
.kpi .trend{font-weight:700}
.trend.up{color:var(--teal)}.trend.down{color:var(--red)}
.tip{position:relative;cursor:help}
.tip[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--midnight);color:#fff;font-size:11.5px;font-weight:500;line-height:1.45;padding:8px 12px;border-radius:8px;width:max-content;max-width:240px;z-index:80;box-shadow:var(--shadow);white-space:normal;text-transform:none;letter-spacing:0}

/* progress */
.pbar{height:6px;border-radius:99px;background:#E7ECF3;overflow:hidden;min-width:64px}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy),#2A4A7F)}
.pbar.gold i{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.pbar.teal i{background:var(--teal)}

/* timeline */
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:24px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-30px;top:3px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid var(--line);z-index:1}
.tl-dot.done{background:var(--teal);border-color:var(--teal);color:#fff}
.tl-dot.now{background:#fff;border-color:var(--gold);box-shadow:0 0 0 4px rgba(44,90,160,.20)}
.tl-dot.now i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}

/* toast + modal */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:var(--midnight);color:#fff;border-radius:11px;padding:13px 16px;font-size:13.5px;box-shadow:var(--shadow-lg);display:flex;gap:11px;align-items:flex-start;animation:tin .25s ease;border-left:3px solid var(--gold)}
.toast.ok{border-left-color:var(--teal)}.toast.err{border-left-color:var(--red)}
.toast b{display:block;font-size:13px}
.toast .muted{color:rgba(255,255,255,.6);font-size:12.5px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#modal-root{position:fixed;inset:0;z-index:150;display:none;align-items:flex-start;justify-content:center;padding:6vh 20px;overflow-y:auto;background:rgba(9,20,39,.55);backdrop-filter:blur(3px)}
#modal-root.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:min .22s ease;overflow:hidden}
.modal.wide{max-width:760px}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.modal-b{padding:18px 24px 24px}
.modal-f{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;background:var(--warm)}
.x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mist)}
.x:hover{background:var(--ivory);color:var(--navy)}

/* dropdown */
.dd{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);min-width:300px;z-index:90;overflow:hidden;animation:min .18s ease}
.dd .dd-h{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between;align-items:center}
.dd .dd-item{padding:12px 16px;border-bottom:1px solid #EFF2F7;font-size:13px;display:flex;gap:11px;cursor:pointer}
.dd .dd-item:hover{background:var(--warm)}
.dd .dd-item:last-child{border-bottom:none}

/* map */
.map-wrap{position:relative;background:linear-gradient(160deg,var(--midnight),var(--navy));border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.map-dot{fill:rgba(255,255,255,.20)}
.mk{cursor:pointer}
.mk circle.pin{fill:var(--gold);stroke:rgba(44,90,160,.30);stroke-width:6;transition:all .15s}
.mk:hover circle.pin,.mk.on circle.pin{stroke-width:10;fill:#E0BE6C}
.mk text{fill:rgba(255,255,255,.78);font-size:8.5px;font-weight:600;font-family:'Inter',sans-serif;pointer-events:none}
.map-card{position:absolute;background:#fff;color:var(--ink);border-radius:13px;box-shadow:var(--shadow-lg);padding:16px 18px;width:248px;z-index:20;border-top:3px solid var(--gold);animation:min .18s ease}

/* misc */
.empty{padding:54px 24px;text-align:center;color:var(--mist)}
.empty .icbox{margin:0 auto 14px}
.proto-note{font-size:11px;color:var(--mist);letter-spacing:.02em}
.divider{height:1px;background:var(--line);border:none;margin:18px 0}
.linklike{color:var(--navy);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.linklike:hover{color:var(--gold-deep)}
.skel{background:linear-gradient(90deg,#EAEFF5 25%,#F5F8FC 50%,#EAEFF5 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
::selection{background:rgba(44,90,160,.30)}
.fade-in{animation:fin .35s ease}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* responsive */
.menu-btn{display:none}
@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .kpis6{grid-template-columns:repeat(3,1fr)!important}
}
@media(max-width:920px){
  .pnav nav,.pnav .nav-cta{display:none}
  .hamb{display:flex}
  .g3{grid-template-columns:1fr 1fr}
  .side{transform:translateX(-100%)}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .menu-btn{display:flex}
  .split2{grid-template-columns:1fr!important}
  .stat-strip{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:640px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis6{grid-template-columns:repeat(2,1fr)!important}
  .section{padding:64px 0}
  .wrap{padding:0 18px}
  .content{padding:20px 16px 60px}
  .topbar{padding:0 16px}
  .topbar h1{font-size:16px}
  .hide-m{display:none!important}
}
@media(max-width:920px){.hide-t{display:none!important}}
.scroll-x{overflow-x:auto}
.scroll-x table{min-width:880px}
.side-scrim{position:fixed;inset:0;background:rgba(9,20,39,.45);z-index:45;display:none}
.side-scrim.open{display:block}

/* wizard */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.wiz-steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wiz-step{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:4px 2px;font-family:'Inter',sans-serif}
.wiz-step:disabled{cursor:default}
.wiz-step i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);color:var(--mist);font-size:11.5px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center;background:#fff;flex:none}
.wiz-step span{font-size:12px;font-weight:600;color:var(--mist);white-space:nowrap}
.wiz-step.on i{border-color:var(--gold);color:var(--gold-deep);box-shadow:0 0 0 4px rgba(44,90,160,.18)}
.wiz-step.on span{color:var(--navy)}
.wiz-step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.wiz-step.done span{color:var(--slate)}
.wiz-line{flex:1;min-width:10px;height:2px;background:var(--line);border-radius:2px}
.wiz-h{font-size:17px;color:var(--navy);margin-bottom:6px}
@media(max-width:920px){.wiz-step span{display:none}.wiz-step.on span{display:inline}}
.upload-zone{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border:2px dashed var(--line);border-radius:12px;background:var(--ivory);cursor:pointer;color:var(--slate);font-family:'Inter',sans-serif}
.upload-zone:hover{border-color:var(--gold);background:#F6F9FD}
.upload-zone b{font-size:13.5px;color:var(--navy)}
</style>

/* ---------- logo ---------- */
/*
 * THE OFFICIAL ARRIVAL LOGO (2026-08-06 brand delivery).
 *
 * Earlier versions hand-traced the mark as inline SVG and set the wordmark in
 * CSS. That reconstruction never matched the real artwork, which is what the
 * client meant by "the alignment is a little off". Do not go back to a traced
 * path or a CSS wordmark. These are the supplied files.
 *
 * img/logo.png / logo-light.png  full lockup, mark + ARRIVAL + RELOCATION PARTNERS
 * img/mark.png / mark-light.png  the "A" mark on its own
 *
 * Both come in a navy and a white cut on transparent backgrounds, because the
 * lockup has to sit on NAVY in several places (report sidebar, portal headers)
 * where the supplied white-background JPG would render as a white box.
 *
 * Aspects are fixed by the artwork: lockup 1000:291, mark 586:512. Derive the
 * width from the height so neither ever squashes.
 */
const LOGO_AR = 1000/291, MARK_AR = 586/512;
function logoMark(size, light){
  return `<img src="https://www.arrivalrelopartners.com/img/mark${light?'-light':''}.png" alt="" aria-hidden="true"
    width="${Math.round(size*MARK_AR)}" height="${size}"
    style="width:${Math.round(size*MARK_AR)}px;height:${size}px;display:block;flex:none">`;
}
/* Second argument is a HEIGHT. It used to be a subtitle string, and six call
   sites still passed things like 'COMMAND CENTER'; that flowed into
   height:COMMAND CENTERpx and the lockup rendered at browser-default size,
   filling the sidebar. Anything non-numeric is ignored rather than trusted. */
function logo(light, size){
  const h = (typeof size === 'number' && isFinite(size) && size > 0) ? size : 44;
  return `<a href="/" data-nav class="logo ${light?'light':''}" aria-label="Arrival Relocation Partners, home">
    <img src="https://www.arrivalrelopartners.com/img/logo${light?'-light':''}.png" alt="Arrival Relocation Partners"
      width="${Math.round(h*LOGO_AR)}" height="${h}"
      style="width:${Math.round(h*LOGO_AR)}px;height:${h}px;display:block">
  </a>`;
}

// Granular transaction milestones, what the agent and Arrival (Command Center) see, including the

const MILESTONES = ['Referral received','Employee intake sent','Intake completed','Arrival review','Agent matched','Introduction completed','Home search started','Offer submitted','Under contract','Inspection','Appraisal','Financing','Closing scheduled','Closed'];
const STAGE_MS = {'Intake':2,'Preferences Pending':2,'Matching':4,'Agent Assigned':6,'Home Search':7,'Under Contract':9,'Closing Scheduled':13,'Completed':14,'On Hold':5};

// no inspection/appraisal/financing, no personal housing detail.
const CORP_MILESTONES = ['Intake completed','Agent matched','Home search active','Offer submitted','Under contract','Closing scheduled','Relocation completed'];
const CORP_MS = {'Intake':0,'Preferences Pending':0,'Matching':1,'Agent Assigned':2,'Home Search':2,'Under Contract':4,'Closing Scheduled':5,'Completed':7,'On Hold':1};

function mkTimeline(rel){
  const reached = STAGE_MS[rel.status] ?? 3;
  const co = relCompanyName(rel);
  const owners = [co,'Arrival','Employee','Arrival','Arrival','Arrival','Agent','Agent','Agent','Agent','Agent','Agent','Agent','Agent'];
  return MILESTONES.map((m,i)=>{
    const done = i < reached, now = i === reached;
    return {label:m, owner:owners[i], status: done?'Complete':(now?'In progress':'Upcoming'),
      date: done ? (milestoneDate(rel, m) || 'Completed') : (now?'In progress':'—'),
      note: done && i===4 && rel.agentId ? `${agentName(rel.agentId)} matched by Arrival` : ''};
  });
}
function mkCorpTimeline(rel){
  const reached = CORP_MS[rel.status] ?? 0;
  return CORP_MILESTONES.map((m,i)=>{
    const done = i < reached, now = i === reached;
    return {label:m, status: done?'Complete':(now?'In progress':'Upcoming'),
      date: done ? (milestoneDate(rel, m) || 'Completed') : (now?'In progress':'—')};
  });
}
function addDays(iso,n){
  const d=_toDate(iso); if(!d || !isFinite(n)) return null;
  d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);
}
/* A real recorded date for this step, or null. Milestones are the only place we
   actually know when something happened. */
function milestoneDate(rel, label){
  const m = (S.activity||[]).find(a=>a.rel===rel.id && a.text &&
              a.text.toLowerCase().includes(String(label).toLowerCase().slice(0,14)));
  return m && m.ts ? String(m.ts).slice(0,10) : null;
}
function fmtD(iso){ const d=_toDate(iso); if(!d) return (iso&&typeof iso==='string'&&!/^\d{4}-/.test(iso))?iso:'—'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDs(iso){ const d=_toDate(iso); return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '—'; }
/* Accepts a date, a timestamp, or nothing. Returns null rather than an Invalid
   Date, because toLocaleDateString on one throws RangeError and a single null
   target_date used to take out the whole relocation detail page. */
function _toDate(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v) ? null : v;
  const str = String(v);
  if(!/^\d{4}-\d{2}-\d{2}/.test(str)) return null;
  const d = new Date(str.length===10 ? str+'T12:00:00' : str);
  return isNaN(d) ? null : d;
}

    S.transactions = (txn.data||[]).map(t=>{
      const relId = refOf.get(t.relocation_id)||null;
      const rel = relId ? relById(relId) : null;
      const co = rel && rel.companyId ? companyById(rel.companyId) : null;
      return {id:t.id, relId, agentId:t.agent_id,
        agent:agentName(t.agent_id), kind:t.kind, status:t.status, close:t.close_date,
        amount:t.amount, fee:t.fee, paid:t.paid_at ? t.paid_at.slice(0,10) : null, invoice:t.invoice_ref,
        company: co ? co.name : (rel && rel.emp ? rel.emp : 'Direct client'),
        due: t.due_on, channel: (rel && rel.channel) || 'Corporate'};
    });
    S.opportunities = (opp.data||[]).map(o=>({id:o.id, relId:refOf.get(o.relocation_id)||null, agentId:o.agent_id,
                     title:o.title, status:o.status, sent:o.sent_at, respondBy:o.respond_by,
                     fee:o.fee_terms, summary:o.summary, respondedAt:o.responded_at}));
    S.referrals   = (ref.data||[]).map(r=>({id:r.id, referrer:r.referrer_name, refEmail:r.referrer_email,
                     relation:r.relation, referred:r.referred_name, invited:r.invited_at,
                     opened:r.opened_at, status:r.status, notes:r.notes}));
    S.monthly    = Data.monthlyRollup(S.relocations);
    S.monthlyRev = Data.monthlyRevRollup(S.transactions);
    return {ok:true, counts:{relocations:S.relocations.length, agents:S.agents.length,
      companies:S.companies.length, transactions:S.transactions.length, opportunities:S.opportunities.length}};
  },

  /* Derived, not stored. A stored rollup goes stale the moment someone edits a
     relocation, and a stale chart on an operations screen is worse than none. */
  monthlyRollup(rels){
    const by = new Map();
    rels.forEach(r=>{
      const k = (r.submitted||'').slice(0,7); if(!k) return;
      if(!by.has(k)) by.set(k, {m:k, new:0, prog:0, closed:0, risk:0});
      const b = by.get(k); b.new++;
      if(r.status==='Completed') b.closed++; else b.prog++;
      if(r.risk==='High') b.risk++;
    });
    return [...by.values()].sort((a,b)=>a.m.localeCompare(b.m)).slice(-12);
  },

  /* Revenue by tier, month over month, from paid transactions. Keyed off the
     same tier labels as TIER_DESC and the customers-by-tier donut, so the two
     charts on ccFin() describe the same three tiers. */
  monthlyRevRollup(txs){
    const TIER_KEY = {'Referral':'referral', 'Preferred Partner':'preferred', 'Enterprise':'enterprise'};
    const by = new Map();
    (txs||[]).forEach(t=>{
      if(t.status!=='Paid' || !t.paid) return;
      const k = String(t.paid).slice(0,7); if(!k) return;
      if(!by.has(k)) by.set(k, {m:k, referral:0, preferred:0, enterprise:0});
      const rel = t.relId ? relById(t.relId) : null;
      const co = rel && rel.companyId ? companyById(rel.companyId) : null;
      /* No company on the relocation is a real "Referral" fee. A company with
         a tier outside the three the app tracks is a data problem, not a
         referral, so it is left out here exactly as it already is from the
         customers-by-tier donut above, rather than guessed into a bucket. */
      const key = co ? TIER_KEY[co.tier] : 'referral';
      if(!key) return;
      by.get(k)[key] += (t.fee||0)/1000;
    });
    return [...by.values()].sort((a,b)=>a.m.localeCompare(b.m)).slice(-12);
  },

  async refresh(){ if(DEMO){ S.monthly = Data.monthlyRollup(S.relocations); S.monthlyRev = Data.monthlyRevRollup(S.transactions); route(); return {ok:true}; }
                   const r = await Data.loadAll(); route(); return r; },

  /* Invoice numbers are allocated by Postgres, not the browser. The old client
     -side 'INV-' + (1052 + count) races: two coordinators invoicing in the same
     minute both read the same count and mint the same reference. */
  async sendInvoice(id){
    const t = (S.transactions||[]).find(x=>x.id===id);
    if(!t) return {ok:false, message:'That transaction is no longer on your list. Refresh and try again.'};
    if(t.status !== 'Pending'){
      return {ok:false, message:'Only a pending transaction can be invoiced. This one is '+t.status.toLowerCase()+'.'};
    }
    if(DEMO){
      t.status = 'Invoiced'; t.invoice = 'INV-'+(2050+S.transactions.filter(x=>x.invoice).length); t.due = demoDate(30);
      await Data.refresh();
      return {ok:true, invoice:t.invoice, due:t.due};
    }

    const c = sb(); if(!c || !ME) return {ok:false};
    const { data, error } = await c.rpc('issue_transaction_invoice', { p_transaction: id });
    if(error){
      console.error('[data] sendInvoice', error);
      return {ok:false, error, message: error.code==='42501'
        ? 'Only an owner can issue invoices.'
        : 'We could not issue that invoice. Nothing was sent, please try again.'};
    }

    await Data.refresh();
    return {ok:true, invoice:data.invoice_ref, due:data.due_on};
  },

  /* Idempotent on purpose: paid_at is only set where it is currently null, so a
     double-click, a stale tab or a retry after a dropped response cannot record
     the same fee twice. The guarded update returns zero rows the second time,
     which we report as already-paid rather than as a failure. */
  async markTransactionPaid(id, paidOn){
    const t = (S.transactions||[]).find(x=>x.id===id);
    if(!t) return {ok:false, message:'That transaction is no longer on your list. Refresh and try again.'};
    if(!['Invoiced','Overdue'].includes(t.status)){
      return {ok:false, message:'Only an invoiced or overdue transaction can be marked paid.'};
    }
    if(DEMO){
      if(t.paid) return {ok:false, already:true, message:'That payment was already recorded.'};
      t.status = 'Paid'; t.paid = paidOn ? new Date(paidOn).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
      await Data.refresh();
      return {ok:true, fee:t.fee, invoice:t.invoice, paidAt:t.paid};
    }

    const c = sb(); if(!c || !ME) return {ok:false};
    const when = paidOn ? new Date(paidOn).toISOString() : new Date().toISOString();
    const { data, error } = await c.from('transactions')
      .update({ status:'Paid', paid_at:when })
      .eq('id', id)
      .is('paid_at', null)
      .select('id, fee, invoice_ref, paid_at');

    if(error){
      console.error('[data] markTransactionPaid', error);
      return {ok:false, error, message: error.code==='42501'
        ? 'Only an owner can record payments.'
        : 'We could not record that payment. Nothing was changed, please try again.'};
    }
    if(!data || !data.length){
      await Data.refresh();
      return {ok:false, already:true, message:'That payment was already recorded.'};
    }

    /* The relocation's own history should show the fee cleared, so the record
       reads the same to whoever opens it next. Employer-invisible: Arrival's
       commercial position is not the customer's business. */
    if(t.relId){
      const r = relById(t.relId);
      if(r) await c.from('milestones').insert({
        relocation_id: r.uuid,
        label: 'Referral fee received',
        note: (data[0].invoice_ref || 'No invoice reference') + ' — ' + fmtMoney(data[0].fee),
        employer_visible: false,
        created_by: ME.id,
      });
    }

    await Data.refresh();
    return {ok:true, fee:data[0].fee, invoice:data[0].invoice_ref, paidAt:data[0].paid_at};
  },

  /* Writes go to the database first. If Postgres refuses, nothing local changes,
     so the screen can never show a change that was not persisted. */
  async setRelocationStatus(ref, uiStatus){
    const r = relById(ref); if(!r) return {ok:false};
    const c = sb();
    const { error } = await c.from('relocations')
      .update({ status: dbStage(uiStatus), last_activity_at: new Date().toISOString() })
      .eq('id', r.uuid);
    if(error){ console.error('[data] status', error); return {ok:false, error}; }
    await c.from('milestones').insert({ relocation_id:r.uuid, label:'Status set to '+uiStatus, created_by: ME.id });
    return Data.refresh();
  },
  async setRelocationProgress(ref, pct){
    const r = relById(ref); if(!r) return {ok:false};
    const { error } = await sb().from('relocations')
      .update({ progress: Math.max(0,Math.min(100,Math.round(pct))), last_activity_at:new Date().toISOString() })
      .eq('id', r.uuid);
    if(error){ console.error('[data] progress', error); return {ok:false, error}; }
    return Data.refresh();
  },
  async assignAgent(ref, agentId){
    const r = relById(ref); if(!r) return {ok:false};
    const { error } = await sb().from('relocations')
      .update({ agent_id: agentId, status:'agent_assigned', last_activity_at:new Date().toISOString() })
      .eq('id', r.uuid);
    if(error){ console.error('[data] assign', error); return {ok:false, error}; }
    await sb().from('milestones').insert({ relocation_id:r.uuid, label:'Agent assigned', created_by: ME.id });
    return Data.refresh();
  },
  async addMilestone(ref, label, note, employerVisible){
    const r = relById(ref); if(!r) return {ok:false};
    const { error } = await sb().from('milestones').insert({
      relocation_id:r.uuid, label, note:note||null,
      employer_visible: employerVisible!==false, created_by: ME.id });
    if(error){ console.error('[data] milestone', error); return {ok:false, error}; }
    return Data.refresh();
  },
  async postMessage(threadId, body){
    const { error } = await sb().from('messages').insert({ thread_id:threadId, sender_id:ME.id, body });
    if(error){ console.error('[data] message', error); return {ok:false, error}; }
    await sb().from('message_threads').update({ last_message_at:new Date().toISOString() }).eq('id', threadId);
    return Data.refresh();
  },
  async toggleTask(id, done){
    const { error } = await sb().from('tasks')
      .update({ completed_at: done ? new Date().toISOString() : null }).eq('id', id);
    if(error){ console.error('[data] task', error); return {ok:false, error}; }
    return Data.refresh();
  },
  async markNotificationRead(id){
    await sb().from('notifications').update({ read_at:new Date().toISOString() }).eq('id', id);
    return Data.refresh();
  },
  /* Creates the relocation, then the opening milestone. If the insert fails
     nothing is written and the caller is told: the referral must never appear
     to have been accepted when it was not. */
  async createRelocation(fields){
    const c = sb(); if(!c || !ME) return {ok:false};
    const ref = fields.ref || ('ARP-' + Date.now().toString().slice(-6));
    const row = {
      ref,
      company_id: ME.appRole==='company' ? ME.companyId : (fields.companyId || null),
      employee_name: fields.emp, employee_email: fields.email || null,
      employee_phone: fields.phone || null, job_title: fields.role || null,
      department: fields.dept || null, origin_city: fields.origin || null,
      destination_city: fields.dest || null, mode: dbMode(fields.mode),
      relocation_type: fields.type || null, target_date: fields.target || null,
      status: 'intake', progress: 0,
    };
    const { data, error } = await c.from('relocations').insert(row).select('id, ref').single();
    if(error){
      console.error('[data] createRelocation', error);
      return {ok:false, error, message: error.code==='42501'
        ? 'You can only refer employees for your own company.'
        : 'We could not save that referral. Nothing was submitted, please try again.'};
    }
    if(fields.notes){
      await c.from('milestones').insert({ relocation_id:data.id,
        label:'Referred by employer', note:fields.notes, employer_visible:true, created_by:ME.id });
    }
    await Data.refresh();
    return {ok:true, ref:data.ref, id:data.id};
  },

  /* Passes the caller's access token so /api/invite can ask Supabase who is
     asking, rather than taking the browser's word for it. */
  async notifyInvite(email, role){
    const c = sb(); if(!c) return {ok:false};
    const { data:{ session:s } = {} } = await c.auth.getSession();
    if(!s) return {ok:false, message:'Your session has expired.'};
    try{
      const r = await fetch('/api/invite', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+s.access_token},
        body: JSON.stringify({email, role, name: ME ? ME.name : ''}),
      });
      const d = await r.json().catch(()=>({}));
      return d.ok ? {ok:true} : {ok:false, message:d.message};
    }catch(e){ return {ok:false}; }
  },

  /* Create a customer company. Staff only, enforced by companies_staff_insert. */
  async createCompany(f){
    const c = sb(); if(!c || !ME) return {ok:false};
    const name = String(f.name||'').trim();
    if(!name) return {ok:false, message:'A company name is required.'};
    const row = {
      name, industry: f.industry||null, hq_city: f.hq||null,
      stage: f.stage || 'prospect', tier: f.tier||null,
      annual_value: f.value ? Number(f.value) : null,
      est_volume: f.est||null, next_step: f.next||null, notes: f.notes||null,
      account_owner: ME.id,
    };
    const { data, error } = await c.from('companies').insert(row).select('id,name').single();
    if(error){
      console.error('[data] createCompany', error);
      return {ok:false, error, message: error.code==='23505'
        ? 'A company with that name already exists.'
        : 'We could not save that company. Nothing was created, please try again.'};
    }
    await Data.refresh();
    return {ok:true, id:data.id, name:data.name};
  },

  /* Add an agent to the routing roster. The agent does NOT get portal access
     here: that is a separate invitation, so adding someone to the roster and
     granting them a login stay separate decisions. */
  async createAgent(f){
    const c = sb(); if(!c || !ME) return {ok:false};
    const name = String(f.name||'').trim();
    if(!name) return {ok:false, message:'The agent\u2019s name is required.'};
    const list = v => String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
    const row = {
      full_name: name, email: f.email||null, phone: f.phone||null,
      brokerage: f.brokerage||null, market: f.market||null,
      years_experience: f.yrs ? parseInt(f.yrs,10) : null,
      closings_count: f.done ? parseInt(f.done,10) : 0,
      languages: list(f.langs), specialties: list(f.specs),
      license_number: f.license||null, license_state: f.licenseState||null,
      license_expires: f.licenseExpires||null,
      bio: f.bio||null,
    };
    const { data, error } = await c.from('agents').insert(row).select('id,full_name').single();
    if(error){
      console.error('[data] createAgent', error);
      /* A duplicate email is a real, common case: someone adding an agent who is
         already on the roster. Say which field, rather than a generic failure
         that leaves them retrying the same thing. */
      const dup = error.code === '23505';
      return {ok:false, error, message: dup
        ? 'An agent with that email address is already on the roster.'
        : 'We could not save that agent. Nothing was created, please try again.'};
    }
    await Data.refresh();
    return {ok:true, id:data.id, name:data.full_name};
  },

  async invite(email, role, companyId, agentId, fullName){
    const { error } = await sb().from('invitations').insert({
      email: String(email||'').trim().toLowerCase(), role,
      full_name: (fullName||'').trim() || null,
      company_id: companyId||null, agent_id: agentId||null, invited_by: ME.id });
    if(error){ console.error('[data] invite', error); return {ok:false, error}; }
    return {ok:true};
  },
};

/* ---------- UI helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* escJs: for values interpolated into a JS string literal that sits inside an HTML
   attribute (e.g. onclick="fn('HERE')"). esc() alone is NOT safe there: the browser
   HTML-decodes the attribute before evaluating it as JS, so &#39; becomes a real
   quote and breaks out of the literal. JS-escape first, then attribute-escape. */
function escJs(s){
  return String(s==null?'':s)
    .replace(/\\/g,'\\\\')
    .replace(/'/g,"\\'")
    .replace(/\r?\n/g,'\\n')
    .replace(/</g,'\\u003C')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;');
}
function toast(title, body, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.innerHTML = `${ic(kind==='err'?'alert':'check','ic-sm')}<div><b>${esc(title)}</b>${body?`<span class="muted">${esc(body)}</span>`:''}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='all .3s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),300); }, 3800);
}
function openModal(html, wide){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  root.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){ const root=document.getElementById('modal-root'); root.classList.remove('open'); root.innerHTML=''; document.body.style.overflow=''; }
function confirmModal(title, body, cta, onYes, danger){
  window.__confirmYes = ()=>{ closeModal(); onYes(); };
  openModal(`
    <div class="modal-h"><h3 style="font-size:17px">${esc(title)}</h3><button class="x" onclick="closeModal()">${ic('x','ic-sm')}</button></div>
    <div class="modal-b"><p class="muted" style="font-size:14px">${body}</p></div>
    <div class="modal-f"><button class="btn btn-outline btn-sm" onclick="closeModal()">Cancel</button>
    <button class="btn ${danger?'btn-navy':'btn-gold'} btn-sm" onclick="__confirmYes()">${esc(cta)}</button></div>`);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- tiny chart helpers (SVG) ---------- */
function chartLine(series, labels, opts){
  // series: [{name,color,values}]
  const W=620,H=210,P={t:14,r:10,b:26,l:30};
  const all = series.flatMap(s=>s.values);
  const max = Math.max(...all)*1.18 || 1;
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const x = i => P.l + (labels.length<2?0:(i/(labels.length-1))*iw);
  const y = v => P.t + ih - (v/max)*ih;
  let grid='', xl='';
  for(let g=0; g<=3; g++){ const gy=P.t+ih*(g/3); grid += `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="#E9E6DC" stroke-width="1"/>`; }
  labels.forEach((l,i)=>{ if(labels.length<=12 || i%2===0) xl += `<text x="${x(i)}" y="${H-8}" font-size="9.5" fill="#8B97A8" text-anchor="middle" font-family="Inter">${l}</text>`; });
  const paths = series.map(s=>{
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`);
    const area = s.area ? `<path d="M${pts.join(' L')} L${x(s.values.length-1)},${P.t+ih} L${x(0)},${P.t+ih} Z" fill="${s.color}" opacity=".07"/>` : '';
    const dots = s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"/>`).join('');
    return `${area}<path d="M${pts.join(' L')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>${dots}`;
  }).join('');
  const legend = series.map(s=>`<span class="flex gap8 tiny" style="color:var(--slate)"><i style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${grid}${xl}${paths}</svg><div class="flex gap16" style="flex-wrap:wrap;margin-top:6px">${legend}</div>`;
}
function chartDonut(parts, centerLabel, centerSub){
  const total = parts.reduce((a,p)=>a+p.v,0)||1;
  const R=64, C=2*Math.PI*R; let off=0;
  const segs = parts.map(p=>{
    const len = (p.v/total)*C;
    const s = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="${Math.max(len-2,0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
    off += len; return s;
  }).join('');
  const legend = parts.map(p=>`<div class="flex between" style="padding:4px 0;font-size:12.5px"><span class="flex gap8" style="color:var(--slate)"><i style="width:9px;height:9px;border-radius:3px;background:${p.color};display:inline-block;flex:none"></i>${esc(p.label)}</span><b class="num" style="color:var(--navy)">${p.v}</b></div>`).join('');
  return `<div class="flex gap16" style="flex-wrap:wrap">
    <svg viewBox="0 0 180 180" style="width:158px;height:158px;flex:none">${segs}
      <text x="90" y="86" text-anchor="middle" font-size="30" font-weight="800" fill="#13294B" font-family="Inter">${centerLabel}</text>
      <text x="90" y="106" text-anchor="middle" font-size="10" fill="#8B97A8" font-family="Inter">${centerSub||''}</text></svg>
    <div style="flex:1;min-width:170px">${legend}</div></div>`;
}
function chartBars(items, color){
  const max = Math.max(...items.map(i=>i.v))*1.12 || 1;
  return `<div style="display:flex;flex-direction:column;gap:10px">` + items.map(i=>`
    <div><div class="flex between tiny" style="margin-bottom:4px"><span class="muted">${esc(i.label)}</span><b class="num" style="color:var(--navy)">${esc(i.disp!=null?i.disp:i.v)}</b></div>
    <div class="pbar"><i style="width:${Math.round(i.v/max*100)}%;background:${color||'linear-gradient(90deg,var(--navy),#2A4A7F)'}"></i></div></div>`).join('') + `</div>`;
}

/* =========================================================
   ROUTER
   ========================================================= */
/* On Arrival's own domain the site is the root, so URLs are clean
   (arrivalrelopartners.com/contact). On the FGA prototype host it stays under
   /arrival. Links are authored as "/arrival/x"; the click handler below strips
   that prefix and nav() re-adds BASE, so both hosts work from one source. */
const BASE = '';   // standalone client site, served at the domain root
function nav(path){
  if(!path.startsWith('/')) path = '/' + path;
  /* BASE is '' on this standalone site, so `BASE + ''` for the home path used to
     hand pushState an EMPTY url. An empty url resolves to the CURRENT document,
     so clicking the logo on /how-it-works pushed /how-it-works and re-rendered
     the same page: the logo looked dead on every page except home. Always push a
     real path. */
  const url = path==='/' ? (BASE || '/') : BASE + path;
  history.pushState({}, '', url);
  route();
  window.scrollTo({top:0});
}
window.addEventListener('popstate', route);
document.addEventListener('click', e=>{
  const a = e.target.closest('a[data-nav]');
  if(a){ e.preventDefault(); const href = a.getAttribute('href'); nav(href.replace(/^\/arrival/,'') || '/'); }
});
function curPath(){
  let p = location.pathname.replace(/\/+$/,'');
  if(BASE && p.startsWith(BASE)) p = p.slice(BASE.length);
  p = p.replace(/^\/arrival(?=\/|$)/,'');   // tolerate legacy /arrival links
  if(p.endsWith('.html')) p = '';     // direct file access in dev
  return p || '/';
}
function route(){
  const p = curPath();
  const app = document.getElementById('app');
  closeModal();
  // legacy path → corporate portal
  if(p.startsWith('/dashboard')){ history.replaceState({},'',BASE + p.replace('/dashboard','/corporate')); return route(); }
  /* Employee and consumer secure links run on the same seeded records as the
     workspaces, so they sit BEHIND the production gate below, not in front of
     it. They used to be handled here, above the gate, which meant a seeded
     token such as /journey/jt-birch-2210 rendered a complete fabricated
     relocation, named people and all, on Arrival's live domain. */
  if(PORTALS_ENABLED && p.startsWith('/e/')){ renderEmpLink(app, p); return; }
  if(PORTALS_ENABLED && p.startsWith('/journey/')){ renderJourney(app, p); return; }
  // The Market Report is real: it runs on live data through /api/market-report.
  if(p.startsWith('/report/')){ renderReport(app, p); return; }

  /* PRODUCTION GATE. Kept as the master switch even now that a real backend
     exists: it is the one line that takes the workspaces off the public site if
     anything downstream needs to be pulled in a hurry. */
  if(!PORTALS_ENABLED && isPortalPath(p)){ renderPortalsComingSoon(app, p); return; }

  /* Session state, not just presence. 'pending' means boot() has not finished
     resolving the session yet; rendering the login screen then would sign out
     every returning user on refresh. */
  if(isPortalPath(p)){
    if(AUTH_STATE === 'pending'){ app.innerHTML = bootSplash(); return; }
    if(AUTH_STATE === 'no_access'){ pageNoAccess(app); return; }
    if(AUTH_STATE === 'unavailable' || AUTH_STATE === 'error'){ pageWorkspaceDown(app); return; }
  }

  const s = session();
  const guard = (need)=>{ // returns true if allowed to stay
    if(!s){ history.replaceState({},'',BASE+'/login'); renderLogin(app, p); return false; }
    if(s.role==='internal') return true;            // staff may view any workspace
    if(s.role!==need){ history.replaceState({},'',BASE+roleHome(s.role)); route(); return false; }
    return true;
  };
  if(p.startsWith('/corporate')){ if(guard('corporate')) renderPortal(app, p); return; }
  if(p.startsWith('/command-center')){
    if(!s){ history.replaceState({},'',BASE+'/login'); renderLogin(app, p); return; }
    if(s.role!=='internal'){ history.replaceState({},'',BASE+roleHome(s.role)); return route(); }
    renderCC(app, p); return;
  }
  if(p==='/agent' || p.startsWith('/agent/')){ if(guard('agent')) renderAgentPortal(app, p); return; }
  if(p === '/login'){ if(s){ history.replaceState({},'',BASE+roleHome(s.role)); return route(); } renderLogin(app); return; }
  renderPublic(app, p);
}
function roleHome(role){ return role==='internal' ? '/command-center' : (role==='agent' ? '/agent' : '/corporate'); }
function viewAs(){ try{ return sessionStorage.getItem(LS_VIEWAS) || null; }catch(e){ return null; } }
function setViewAs(v){ try{ v ? sessionStorage.setItem(LS_VIEWAS, v) : sessionStorage.removeItem(LS_VIEWAS); }catch(e){} }
/* THE EFFECTIVE ROLE, derived from the real one.
   This returned 'owner' for ANY internal user unless they had explicitly picked
   the coordinator preview, so a real signed-in coordinator was treated as an
   owner and saw the financials. The database role decides; View As may only
   ever REDUCE what is shown, never raise it. */
function effRole(){
  if(!ME) return null;
  const real = ME.appRole;                     // owner | coordinator | support | agent | company
  if(real === 'agent' || real === 'company') return real;
  const v = viewAs();
  if(v === 'coordinator') return 'coordinator';   // owner previewing a coordinator
  if(v === 'corporate' || v === 'agent') return v;
  return real;                                  // owner stays owner, coordinator stays coordinator
}
/* Financials are the customer's own commercial position: fees, invoices,
   pipeline value. Arrival's owner sees them. A coordinator coordinates moves and
   has no reason to, and neither does the vendor's support account: it is the
   customer's money, not ours. */
const OWNER_ONLY = ['financials','forecasts','team-admin'];

function mapSVG(idPrefix){
  const {W,H,nation,borders,xy} = US_MAP;
  // dotted texture clipped to the real landmass
  let dots='';
  const step=14;
  for(let py=7;py<H;py+=step){ for(let px=7;px<W;px+=step){ dots+=`<circle class="map-dot" cx="${px}" cy="${py}" r="2"/>`; } }
  const marks = MARKETS.map((m,i)=>`<g class="mk" data-mi="${i}" transform="translate(${xy[i][0]},${xy[i][1]})" onclick="showMarket(event,${i},'${idPrefix}')"><circle class="pin" r="6"/><circle r="18" fill="transparent"/></g>`).join('');
  return `<div class="map-wrap" id="${idPrefix}-wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" aria-label="Arrival agent network coverage map">
      <defs><clipPath id="${idPrefix}-clip"><path d="${nation}"/></clipPath></defs>
      <path d="${nation}" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.40)" stroke-width="1.6" stroke-linejoin="round"/>
      <g clip-path="url(#${idPrefix}-clip)">${dots}</g>
      <path d="${borders}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
      ${marks}</svg>
    <div id="${idPrefix}-card"></div>
  </div>`;
}
function showMarket(ev, i, idPrefix){
  ev.stopPropagation();
  const m = MARKETS[i];
  const wrap = document.getElementById(idPrefix+'-wrap');
  const card = document.getElementById(idPrefix+'-card');
  wrap.querySelectorAll('.mk').forEach(el=>el.classList.toggle('on', el.dataset.mi==String(i)));
  const rect = wrap.getBoundingClientRect();
  const g = wrap.querySelector(`.mk[data-mi="${i}"]`).getBoundingClientRect();
  let left = g.left - rect.left + 18, top = g.top - rect.top - 10;
  if(left + 260 > rect.width) left = g.left - rect.left - 266;
  if(left < 0) left = 8;
  if(top + 170 > rect.height) top = rect.height - 175;
  if(top < 0) top = 4;
  card.innerHTML = `<div class="map-card" style="left:${left}px;top:${top}px">
    <div class="flex between"><b style="font-size:14.5px;color:var(--navy)">${esc(m.city)}, ${m.st}</b>
      <button class="x" style="width:24px;height:24px" onclick="document.getElementById('${idPrefix}-card').innerHTML='';document.querySelectorAll('#${idPrefix}-wrap .mk').forEach(e=>e.classList.remove('on'))">${ic('x','ic-sm')}</button></div>
    <hr class="divider" style="margin:10px 0">
    <div class="grid g2" style="gap:10px;font-size:12px">
      <div><span class="muted tiny">Vetted agents</span><br><b class="num" style="font-size:16px;color:var(--navy)">${m.agents}</b></div>
      <div><span class="muted tiny">Avg. response</span><br><b class="num" style="font-size:16px;color:var(--navy)">${m.resp}</b></div>
      <div><span class="muted tiny">Relocations</span><br><b class="num" style="font-size:16px;color:var(--navy)">${m.done}</b></div>
      <div><span class="muted tiny">Specialty</span><br><b style="font-size:11px;color:var(--gold-deep);line-height:1.3;display:block">${esc(m.spec)}</b></div>
    </div></div>`;
}

async function submitContact(e){
  e.preventDefault();
  const f = e.target, err = document.getElementById('contact-err');
  const need = ['name','company','email'];
  let bad = false;
  need.forEach(n=>{ const el=f.elements[n]; const ok = el.value.trim() && (n!=='email'||/.+@.+\..+/.test(el.value)); el.classList.toggle('err',!ok); if(!ok) bad=true; });
  if(bad){ err.textContent = 'Please complete the required fields with a valid work email.'; return; }
  err.textContent='';
  const btn = document.getElementById('contact-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Sending\u2026';

  const g = n => (f.elements[n] && f.elements[n].value || '').trim();
  const name = g('name');
  const payload = {name, company:g('company'), email:g('email'), phone:g('phone'),
    inqtype:g('inqtype'), volume:g('volume'), method:g('method'), markets:g('markets'),
    msg:g('msg'), website:g('website')};   // `website` is the honeypot

  let ok=false, message='';
  try{
    const r = await fetch('/api/lead', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const d = await r.json().catch(()=>({}));
    ok = !!d.ok; message = d.message||'';
  }catch(_){ ok=false; message=''; }

  if(!ok){
    // Never show a thank-you for a message we did not deliver.
    btn.disabled=false; btn.innerHTML = 'Request a consultation';
    err.innerHTML = esc(message || 'We could not send your message just now.') +
      ' You can reach us directly at <a href="mailto:' + esc(ARRIVAL_CONTACT_EMAIL) + '">' + esc(ARRIVAL_CONTACT_EMAIL) + '</a>.';
    return;
  }

  document.getElementById('contact-card').innerHTML = `
    <div style="text-align:center;padding:34px 10px">
      <div class="icbox gold" style="width:62px;height:62px;margin:0 auto;border-radius:50%">${ic('check','ic-lg')}</div>
      <h3 class="serif" style="font-size:26px;margin-top:18px">Thank you, ${esc(name.split(' ')[0])}.</h3>
      <p class="muted" style="margin-top:10px;max-width:400px;margin-left:auto;margin-right:auto">Your consultation request has been received. A relocation coordinator will be in touch within one business day.</p>
      <a href="/" data-nav class="btn btn-outline" style="margin-top:22px">Back to home</a>
    </div>`;
  toast('Consultation requested','We\u2019ll be in touch within one business day.','ok');
}

  </div>`;

function applyReloFilters(){
  const f = RELO_FILTERS;
  let rows = S.relocations.filter(r=>{
    const hay = (r.emp+' '+r.origin+' '+r.dest+' '+r.id+' '+agentName(r.agentId)+' '+r.type).toLowerCase();
    return (!f.q || hay.includes(f.q.toLowerCase())) &&
      (f.status==='All' || r.status===f.status) &&
      (f.risk==='All' || r.risk===f.risk);
  });
  rows.sort((a,b)=>{
    let va=a[f.sort], vb=b[f.sort];
    if(f.sort==='agent'){ va=agentName(a.agentId); vb=agentName(b.agentId); }
    return (va<vb?-1:va>vb?1:0)*f.dir;
  });
  const per = 8, pages = Math.max(1, Math.ceil(rows.length/per));
  if(f.page>pages) f.page = pages;
  const slice = rows.slice((f.page-1)*per, f.page*per);
  const el = document.getElementById('relo-table'); if(!el) return;
  el.innerHTML = reloTable(slice, {sortable:true}) + `
    <div class="flex between" style="padding:13px 18px;border-top:1px solid var(--line)">
      <span class="tiny muted">${rows.length} relocation${rows.length===1?'':'s'}</span>
      <div class="flex gap8">
        <button class="btn btn-outline btn-xs" ${f.page<=1?'disabled':''} onclick="RELO_FILTERS.page--;applyReloFilters()">Previous</button>
        <span class="tiny muted num">Page ${f.page} of ${pages}</span>
        <button class="btn btn-outline btn-xs" ${f.page>=pages?'disabled':''} onclick="RELO_FILTERS.page++;applyReloFilters()">Next</button>
      </div>
    </div>`;
}
function sortRelo(col){
  if(RELO_FILTERS.sort===col) RELO_FILTERS.dir*=-1; else { RELO_FILTERS.sort=col; RELO_FILTERS.dir=1; }
  applyReloFilters();
}
function reloTable(rows, opts){
  opts = opts||{};
  const th = (label,col)=> opts.sortable ? `<th class="th-sort" onclick="sortRelo('${col}')">${label} ${RELO_FILTERS.sort===col?(RELO_FILTERS.dir>0?'↑':'↓'):''}</th>` : `<th>${label}</th>`;
  return `<div class="scroll-x"><table class="tbl">

      <td><span class="badge ${STAGE_BADGE[r.status]}"><span class="dot"></span>${r.status}</span></td>
      <td style="font-size:12.5px">${r.agentId?esc(agentName(r.agentId)):'<span class="muted">Pending match</span>'}</td>
      <td class="num" style="font-size:12.5px">${fmtDs(r.target)}</td>
      <td><div class="flex gap8"><div class="pbar" style="width:70px"><i style="width:${r.progress}%"></i></div><span class="tiny muted num">${r.progress}%</span></div></td>
      <td><span class="badge ${RISK_BADGE[r.risk]||'b-gray'}">${riskLabel(r.risk)}</span></td>
      <td class="muted num" style="font-size:12px">${fmtDs(r.last)}</td>
      <td>${ic('chevR','ic-sm')}</td>
    </tr>`).join('')}
    ${rows.length===0?`<tr><td colspan="10"><div class="empty"><div class="icbox navy">${ic('search')}</div><b style="color:var(--navy)">No relocations match</b><p class="small" style="margin-top:4px">Try clearing your search or filters.</p></div></td></tr>`:''}

async function sendMsg(e, thId){
  e.preventDefault();
  const inp = document.getElementById('msg-in-'+thId);
  const v = inp.value.trim(); if(!v) return;
  /* The message is persisted, and NOTHING replies.
     This used to push the sender's message into memory and then, 1.6 seconds
     later, fabricate a reply from a coordinator who does not exist, complete
     with a "new message" toast. On a live customer's site that is a person
     being invented to answer them. A real reply arrives when a real
     coordinator writes one. */
  inp.disabled = true;
  const r = await Data.postMessage(thId, v);
  inp.disabled = false;
  if(r && r.ok===false){
    toast('Not sent','That message was not delivered. Please try again.','err');
    return;
  }
  inp.value = '';
  window.__afterRender = ()=>{ const sc=document.getElementById('th-scroll'); if(sc) sc.scrollTop=sc.scrollHeight; };
}

const WIZ_DEF = {step:1, done:false, ref:null, data:{
  emp:'', role:'', dept:'Clinical Operations', email:'', phone:'',
  origin:'', dest:'Atlanta, GA', type:'Physician Relocation', mode:'Buyer', target:'',
  authBy:'', costCenter:'', package:'Standard relocation package', authDoc:'', confirmAuth:false,
}};
let WIZ = JSON.parse(JSON.stringify(WIZ_DEF));
const WIZ_STEPS = ['Employee','Move Details','Authorization','Review & Submit'];

function wizCollect(){
  document.querySelectorAll('[data-wz]').forEach(el=>{
    const k = el.getAttribute('data-wz');
    WIZ.data[k] = el.type==='checkbox' ? el.checked : el.value;
  });
}
function wizGo(n){
  wizCollect();
  if(n > WIZ.step){
    const miss = wizValidate(WIZ.step);
    if(miss){ toast('A few details needed', miss, 'err'); route(); return; }
  }
  WIZ.step = Math.min(Math.max(n,1),4);
  route(); window.scrollTo({top:0});
}
function wizValidate(step){
  const d = WIZ.data;
  if(step===1){ if(!d.emp.trim()||!d.role.trim()||!d.email.trim()) return 'Employee name, role, and email are required.'; if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email.trim())) return 'Please enter a valid email address.'; }
  if(step===2){ if(!d.origin.trim()||!d.dest.trim()||!d.target) return 'Origin, destination, and target date are required.'; }
  if(step===3){ if(!d.costCenter.trim()) return 'A cost center is required for authorization.'; if(!d.confirmAuth) return 'Please confirm you are authorized to submit this relocation.'; }
  return null;
}
function wizField(label, key, opts){
  opts = opts || {};
  const v = esc(WIZ.data[key] ?? '');
  let input;
  if(opts.select) input = `<select class="in" data-wz="${key}">${opts.select.map(o=>`<option ${WIZ.data[key]===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(opts.area) input = `<textarea class="in" rows="3" data-wz="${key}" placeholder="${esc(opts.ph||'')}">${v}</textarea>`;
  else input = `<input class="in" type="${opts.type||'text'}" data-wz="${key}" value="${v}" placeholder="${esc(opts.ph||'')}">`;
  return `<div class="field"><label>${esc(label)}${opts.req?' <span style="color:var(--gold-deep)">*</span>':''}</label>${input}${opts.hint?`<span class="tiny muted" style="margin-top:4px;display:block">${esc(opts.hint)}</span>`:''}</div>`;

    const r = await Data.createRelocation({

const REP_F = {range:'Last 12 months', dept:'All departments', dest:'All destinations'};
function pgReports(){
  /* Both columns are nullable, and an unset one used to become a literal "null"
     option in the filter. Drop the blanks rather than offer them. */
  const depts = ['All departments', ...[...new Set(S.relocations.map(r=>r.dept).filter(Boolean))].sort()];
  const dests = ['All destinations', ...[...new Set(S.relocations.map(r=>r.dest).filter(Boolean))].sort()];
  const rows = S.relocations.filter(r=>
    (REP_F.dept==='All departments'||r.dept===REP_F.dept) &&
    (REP_F.dest==='All destinations'||r.dest===REP_F.dest)
  );
  const months = REP_F.range==='Last 3 months' ? S.monthly.slice(9) : REP_F.range==='Last 6 months' ? S.monthly.slice(6) : S.monthly;
  const completed = rows.filter(r=>r.status==='Completed');
  const sat = rows.filter(r=>r.satisfaction);
  const avgSat = sat.length ? (sat.reduce((a,r)=>a+r.satisfaction,0)/sat.length).toFixed(1) : '—';
  const byDest = {};
  rows.forEach(r=>byDest[r.dest]=(byDest[r.dest]||0)+1);
  const destBars = Object.entries(byDest).sort((a,b)=>b[1]-a[1]).slice(0,7).map(([l,v])=>({label:l,v}));
    /* Group only what is recorded. relocation_type is nullable, and using it as a
     key put a slice labelled "null" on the employer's chart. */
  const byType = {};
  rows.forEach(r=>{ const k = r.type || 'Not categorised'; byType[k] = (byType[k]||0)+1; });
  const typeColors = ['#13294B','#2C5AA0','#2E7D6B','#2A4A7F','#B97A1F','#9AA7B8'];
  window.__afterRender = ()=>{
    const el = document.getElementById('rep-chart');
    if(el) el.innerHTML = chartLine([
      {name:'Submitted', color:'#2C5AA0', values:months.map(m=>m.new)},
      {name:'In progress', color:'#13294B', values:months.map(m=>m.prog), area:true},
      {name:'Completed', color:'#2E7D6B', values:months.map(m=>m.closed)},
    ], months.map(m=>m.m));
  };
  return `
  <div class="flex between" style="margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <p class="small" style="max-width:560px">Program-level reporting across your relocation activity. Figures are calculated from your own records; in production these reflect live transaction records.</p>

      <button class="btn btn-outline btn-sm" onclick="exportCSV('relocations')">${ic('download','ic-sm')} Export CSV</button>
      <button class="btn btn-navy btn-sm" onclick="notWired('Scheduled PDF reporting')">${ic('doc','ic-sm')} Generate PDF</button>
    </div>
  </div>
  <div class="card" style="padding:14px 16px;margin-bottom:16px">
    <div class="flex gap8" style="flex-wrap:wrap">
      ${ic('filter','ic-sm')}
      <select class="in" style="width:auto" onchange="REP_F.range=this.value;route()">${['Last 12 months','Last 6 months','Last 3 months'].map(o=>`<option ${REP_F.range===o?'selected':''}>${o}</option>`).join('')}</select>
      <select class="in" style="width:auto" onchange="REP_F.dept=this.value;route()">${depts.map(o=>`<option ${REP_F.dept===o?'selected':''}>${o}</option>`).join('')}</select>
      <select class="in" style="width:auto" onchange="REP_F.dest=this.value;route()">${dests.map(o=>`<option ${REP_F.dest===o?'selected':''}>${o}</option>`).join('')}</select>
      ${(REP_F.dept!=='All departments'||REP_F.dest!=='All destinations')?`<button class="btn btn-ghost btn-xs" onclick="REP_F.dept='All departments';REP_F.dest='All destinations';route()">Clear</button>`:''}
    </div>
  </div>
  <div class="grid g4" style="gap:14px;margin-bottom:18px">
    ${[
      {l:'Relocations in view',v:rows.length,s:'Matching current filters'},
      {l:'Completed',v:completed.length,s:'Including 2026 closings'},
      {l:'Avg. satisfaction',v:avgSat+(avgSat==='—'?'':' / 5'),s:sat.length+' surveys returned'},
      {l:'Est. program savings',v:'$452,600',s:'YTD, prototype estimate'},
    ].map(k=>`<div class="card kpi"><div class="k-label">${k.l}</div><div class="k-val num">${k.v}</div><div class="k-sub">${k.s}</div></div>`).join('')}
  </div>
  <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:18px" id="rep-row">
    <style>@media(max-width:1000px){#rep-row,#rep-row2{grid-template-columns:1fr!important}}</style>
    <div class="card card-pad">
      <h3 style="font-size:15.5px;margin-bottom:14px">Volume over time, ${REP_F.range.toLowerCase()}</h3>
      <div id="rep-chart"></div>
    </div>
    <div class="card card-pad">
      <h3 style="font-size:15.5px;margin-bottom:16px">By relocation type</h3>
      ${chartDonut(Object.entries(byType).map(([label,v],i)=>({label,v,color:typeColors[i%typeColors.length]})), rows.length, 'IN VIEW')}
    </div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:18px;margin-top:18px" id="rep-row2">
    <div class="card card-pad">
      <h3 style="font-size:15.5px;margin-bottom:16px">Top destination markets</h3>
      ${chartBars(destBars)}
    </div>
    <div class="card card-pad">
      <h3 style="font-size:15.5px;margin-bottom:16px">Program health</h3>
      ${chartBars([
        {label:'On-time milestone rate',v:92,disp:'92%'},
        {label:'Avg. days to agent match',v:42,disp:'4.2 days'},
        {label:'Intake completion within 5 days',v:83,disp:'83%'},
        {label:'Employee satisfaction (5.0 scale)',v:96,disp:avgSat},
        {label:'Closings without schedule slip',v:88,disp:'88%'},
      ],'linear-gradient(90deg,var(--gold-deep),var(--gold))')}
      <p class="tiny muted" style="margin-top:14px">Demonstration metrics for prototype purposes.</p>
    </div>
  </div>`;
}

async function ccInviteBound(prefix, role, companyId, agentId){
  const em = ((document.getElementById(prefix+'-email')||{}).value||'').trim().toLowerCase();
  const nm = ((document.getElementById(prefix+'-name')||{}).value||'').trim();
  const btn = document.getElementById(prefix+'-go');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('Check the address','That does not look like an email address.','err'); return; }
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Inviting\u2026'; }
  const r = await Data.invite(em, role, companyId, agentId, nm);
  if(!r.ok){
    if(btn){ btn.disabled=false; btn.innerHTML=ic('mail','ic-sm')+' Send invitation'; }
    toast('Not invited','That invitation was not saved.','err'); return;
  }
  const note = await Data.notifyInvite(em, role);
  closeModal();
  if(note.ok) toast('Invitation sent', em + ' has been emailed a link to sign in.', 'ok');
  else toast('Access granted, email not sent', note.message || ('Ask ' + em + ' to sign in at arrivalrelopartners.com/login.'), 'err');
  route();
}

/* ---------- CC dashboard ---------- */
function ccDash(){
  const rels = allRels();
  const active = rels.filter(r=>r.status!=='Completed').length;
  const pipeline = (S.companies||[]).filter(c=>!['Customer','Lost'].includes(c.stage));
  const pipeVal = pipeline.reduce((a,c)=>a+(c.value||0),0);
  const pendingFees = (S.transactions||[]).filter(t=>['Pending','Invoiced','Overdue'].includes(t.status)).reduce((a,t)=>a+t.fee,0);
  const overdue = (S.transactions||[]).filter(t=>t.status==='Overdue');
  const attn = [];
  overdue.forEach(t=>attn.push({sev:'high', t:`Invoice ${t.invoice} is overdue, ${fmtMoney(t.fee)}`, d:`${t.invoice||'Invoice'} · ${t.close?fmtD(t.close):'no close date'}`, href:'/command-center/transactions'}));
  /* COMPUTED from live records. This opened with a hardcoded coverage gap
     naming an applicant and two case numbers that exist in no database, so it
     appeared on every workspace including empty ones. */
  (function(){
    const roster = {}, demand = {};
    S.agents.filter(a=>a.market).forEach(a=>{ const c=a.market.split(',')[0].trim(); roster[c]=(roster[c]||0)+1; });
    rels.filter(r=>r.status!=='Completed').forEach(r=>{ const c=(r.dest||'').split(',')[0].trim(); if(c) demand[c]=(demand[c]||0)+1; });
    Object.keys(demand).filter(c=>demand[c] > (roster[c]||0)).forEach(c=>{
      attn.push({sev:'high', t:`${c} coverage gap, ${demand[c]} active move${demand[c]===1?'':'s'}, ${roster[c]||0} agent${(roster[c]||0)===1?'':'s'}`,
        d:'More demand than roster in this market.', href:'/command-center/coverage'});
    });
  })();
  rels.filter(r=>r.status==='Matching').forEach(r=>attn.push({sev:'med', t:`Agent matching needed, ${r.emp} (${r.id})`, d:`${relCompanyName(r)} · ${r.origin||'origin TBC'} → ${r.dest||'destination TBC'}`, href:'/command-center/relocations/'+r.id}));
  rels.filter(r=>r.status==='Intake' && r.submitted &&
      (Date.now() - new Date(r.submitted).getTime())/86400000 > 7)
    .forEach(r=>attn.push({sev:'med',
      t:`Intake stalled ${Math.floor((Date.now()-new Date(r.submitted).getTime())/86400000)} days, ${r.emp}`,
      d:'No preferences submitted since referral.', href:'/command-center/relocations/'+r.id}));
  const tasks = (S.tasks||[]).filter(t=>!t.done).slice(0,6);
  return `
  <div class="grid gap12" style="grid-template-columns:repeat(4,1fr)">
    <div class="card kpi"><div class="k-label">ACTIVE RELOCATIONS</div><div class="k-val">${active}</div><div class="k-sub">across ${new Set(rels.map(r=>r.companyId).filter(Boolean)).size} customer companies</div></div>
    ${can('financials')?`<div class="card kpi"><div class="k-label">PIPELINE VALUE</div><div class="k-val">${fmtMoney(pipeVal)}</div><div class="k-sub">${pipeline.length} open prospects</div></div>
    <div class="card kpi"><div class="k-label">FEES OUTSTANDING</div><div class="k-val">${fmtMoney(pendingFees)}</div><div class="k-sub">${overdue.length} overdue invoice${overdue.length===1?'':'s'}</div></div>`:''}
    <div class="card kpi"><div class="k-label">NETWORK AGENTS</div><div class="k-val">${S.agents.length}</div><div class="k-sub">on the routing roster</div></div>
  </div>
  <div class="grid gap12" style="grid-template-columns:1.4fr 1fr;margin-top:14px;align-items:start">
    <div class="card card-pad">
      <h3 style="font-size:15px;margin-bottom:12px">Needs attention</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${attn.map(a=>`<a href="${a.href}" data-nav style="text-decoration:none" class="card card-hover" >
          <div class="flex gap12" style="padding:12px 14px">
            <span class="badge ${a.sev==='high'?'b-red':'b-amber'}" style="flex:none;margin-top:2px">${a.sev==='high'?'High':'Medium'}</span>
            <div><b style="font-size:13.5px;color:var(--navy)">${esc(a.t)}</b><div class="tiny muted" style="margin-top:2px">${esc(a.d)}</div></div>
          </div></a>`).join('')}
      </div>
    </div>
    <div class="card card-pad">
      <div class="flex between"><h3 style="font-size:15px">My tasks</h3><a class="linklike tiny" href="/command-center/tasks" data-nav>All tasks</a></div>
      <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
        ${tasks.map(t=>`<div class="flex gap8" style="align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)">
          <button class="iconbtn" style="width:22px;height:22px;flex:none" onclick="toggleITask('${t.id}')" aria-label="Complete task">${ic('check','ic-sm')}</button>
          <div><span style="font-size:13px;color:var(--ink)">${esc(t.title)}</span>
          <div class="tiny muted">${esc(t.owner)} · due ${fmtDs(t.due)} · <span class="badge ${t.pri==='High'?'b-red':t.pri==='Medium'?'b-amber':'b-gray'}" style="font-size:9px">${t.pri}</span></div></div>
        </div>`).join('')}
      </div>
    </div>
    ${ccDirectDashCard()}
  </div>`;
}

        <b style="font-size:13.5px;color:var(--navy)">${esc(c.name)}</b>
        <div class="tiny muted" style="margin:3px 0">${esc(c.industry)} · ${esc(c.hq)}</div>
        <div class="tiny" style="color:var(--slate)">${esc(c.est)}${c.value?` · <b class="num">${fmtMoney(c.value)}</b>`:''}</div>
        <div class="tiny muted" style="margin-top:6px">${esc(c.next)}</div>
        <div class="flex gap8" style="margin-top:10px">
          ${c.stage!=='Lost'?`<button class="btn btn-outline btn-xs" onclick="event.stopPropagation();ccStageModal('${c.id}')">Move stage</button>`:''}

        </div>
      </div>`).join('') || '<div class="tiny muted" style="padding:8px 2px">—</div>'}

  }).join('');
  return seg + `<div class="scroll-x"><div class="flex gap12" style="align-items:flex-start;min-width:1100px">${cols}</div></div>`;
